<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Arthur Ottevaere — Portfolio</title>
<meta name="description" content="Portfolio of Arthur Ottevaere — Business Engineering & Analytics student, Brussels."/>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ── CSS custom properties ─────────────────────────────────────── */
  :root {
    /* Light theme */
    --bg:              #ffffff;
    --bg-soft:         #fafaf9;
    --bg-elev:         #ffffff;
    --fg:              #0a0a0a;
    --fg-muted:        #71717a;
    --fg-faint:        #a1a1aa;
    --border:          #e7e5e4;
    --border-strong:   #d6d3d1;
    --hover:           #f5f5f4;
    --accent:          #0a0a0a;
    --accent-fg:       #ffffff;
    --available:       #16a34a;
    --blue:            #2563eb;
    --blue-soft:       #eff6ff;
    --blue-fg:         #1d4ed8;
    --tag-bg:          #f5f5f4;
    --shadow:          0 1px 0 rgba(0,0,0,0.04), 0 8px 24px -12px rgba(0,0,0,0.08);
    --shadow-lg:       0 1px 0 rgba(0,0,0,0.04), 0 24px 60px -24px rgba(0,0,0,0.12);
  }
  html[data-theme="dark"] {
    --bg:              #0a0a0a;
    --bg-soft:         #0e0e0e;
    --bg-elev:         #131313;
    --fg:              #fafafa;
    --fg-muted:        #a1a1aa;
    --fg-faint:        #71717a;
    --border:          #1f1f1f;
    --border-strong:   #2a2a2a;
    --hover:           #161616;
    --accent:          #fafafa;
    --accent-fg:       #0a0a0a;
    --available:       #4ade80;
    --blue:            #60a5fa;
    --blue-soft:       #0b1a33;
    --blue-fg:         #93c5fd;
    --tag-bg:          #161616;
    --shadow:          0 1px 0 rgba(255,255,255,0.02), 0 8px 24px -12px rgba(0,0,0,0.6);
    --shadow-lg:       0 1px 0 rgba(255,255,255,0.02), 0 24px 60px -24px rgba(0,0,0,0.7);
  }

  /* ── Reset & base ───────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--fg); }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-feature-settings: "ss01", "ss03", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    transition: background 200ms ease, color 200ms ease;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  a { color: inherit; }
  button { font-family: inherit; }
  textarea, input { font-family: inherit; }
  .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── Layout ─────────────────────────────────────────────────────── */
  .shell { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px) { .shell { padding: 0 20px; } }

  /* ── Liquid glass nav (01) ──────────────────────────────────────── */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: transparent; border-bottom: 0;
    padding: 12px 0 8px;
    transition: padding 220ms ease;
    pointer-events: none;
  }
  .nav-inner {
    pointer-events: auto;
    height: 56px;
    padding: 0 8px 0 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
    border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--border-strong) 60%, transparent);
    background: color-mix(in oklab, var(--bg-elev) 58%, transparent);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow:
      0 14px 40px -20px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.35);
    transition: background 220ms ease, border-color 220ms ease, box-shadow 220ms ease;
  }
  html[data-theme="dark"] .nav-inner {
    background: color-mix(in oklab, var(--bg-elev) 60%, transparent);
    box-shadow:
      0 14px 40px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  .nav.scrolled .nav-inner {
    background: color-mix(in oklab, var(--bg-elev) 78%, transparent);
  }

  /* Brand */
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--fg); text-decoration: none; cursor: pointer;
    background: none; border: 0; padding: 0;
  }
  .brand-dot {
    width: 18px; height: 18px; border-radius: 4px;
    background: var(--blue); display: inline-block; position: relative;
    transition: transform 240ms cubic-bezier(.2,.7,.2,1), box-shadow 240ms ease;
  }
  .brand:hover .brand-dot { transform: rotate(-12deg) scale(1.06); box-shadow: 0 6px 18px -6px var(--blue); }
  .brand-dot::after {
    content: ""; position: absolute; inset: 5px; border-radius: 1px;
    background: var(--bg);
  }

  /* Nav links */
  .nav-links { position: relative; display: flex; align-items: center; gap: 2px; }
  .nav-link {
    position: relative; appearance: none; background: transparent; border: 0;
    color: var(--fg-muted); cursor: pointer;
    font-size: 14px; padding: 8px 12px; border-radius: 8px;
    letter-spacing: -0.005em;
    transition: color 160ms ease, background 160ms ease;
  }
  .nav-link:hover  { color: var(--fg); background: color-mix(in oklab, var(--fg) 6%, transparent); }
  .nav-link.active { color: var(--fg); }

  /* Sliding underline indicator — single element that glides between links */
  .nav-indicator {
    position: absolute; bottom: 3px; height: 2px;
    background: var(--blue); border-radius: 999px;
    pointer-events: none; z-index: 1;
    box-shadow: 0 0 8px -2px var(--blue);
    transition:
      left    380ms cubic-bezier(.34,1.15,.6,1),
      width   300ms cubic-bezier(.2,.7,.2,1),
      opacity 200ms ease;
  }
  .nav-indicator.hidden { opacity: 0; }

  /* Nav right */
  .nav-right { display: flex; align-items: center; gap: 8px; }

  /* Icon button (theme toggle) */
  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: var(--bg-elev);
    color: var(--fg); cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
  }
  .icon-btn:hover  { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  .icon-btn:active { transform: scale(0.94) rotate(-10deg); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* CV button */
  .cv-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg-elev);
    font-size: 13px; color: var(--fg); cursor: pointer; text-decoration: none;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
  }
  .cv-btn:hover  { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  .cv-btn:hover svg { transform: translateY(2px); }
  .cv-btn svg { width: 14px; height: 14px; transition: transform 200ms cubic-bezier(.2,.7,.2,1); }
  .cv-btn:active { transform: scale(0.97); }

  /* ── Page transitions ───────────────────────────────────────────── */
  .page-enter { animation: pageIn 360ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(6px); filter: blur(2px); }
    to   { opacity: 1; transform: translateY(0);   filter: blur(0);   }
  }

  /* ── Footer ─────────────────────────────────────────────────────── */
  .foot { margin-top: 180px; padding: 14px 0; border-top: 1px solid var(--border); }
  .foot-inner {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--fg-muted);
  }

  /* ── Typography utilities ───────────────────────────────────────── */
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg-muted);
  }
  .h1 {
    font-size: clamp(48px, 7vw, 88px); line-height: 0.98;
    letter-spacing: -0.035em; font-weight: 500; margin: 0;
  }
  .h2 {
    font-size: 40px; line-height: 1.05; letter-spacing: -0.025em;
    font-weight: 500; margin: 0;
  }
  .sub {
    color: var(--fg-muted); font-size: 16px; line-height: 1.55;
    letter-spacing: -0.005em;
  }
  .divider { height: 1px; background: var(--border); border: 0; }

  /* ── Shared buttons ─────────────────────────────────────────────── */
  .btn-primary {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 20px; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg);
    border: 1px solid var(--accent);
    font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 0 0 0 var(--blue);
    transition: transform 140ms ease, box-shadow 240ms ease, background 200ms ease, border-color 200ms ease;
  }
  .btn-primary:hover {
    background: var(--blue); border-color: var(--blue);
    box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 8px 24px -8px var(--blue);
  }
  .btn-primary:hover svg { transform: translateX(4px); }
  .btn-primary svg { width: 14px; height: 14px; transition: transform 220ms cubic-bezier(.2,.7,.2,1); }
  .btn-primary:active { transform: scale(0.97); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 20px; border-radius: 10px;
    background: var(--bg-elev); color: var(--fg);
    border: 1px solid var(--border);
    font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background 200ms ease, border-color 200ms ease, color 200ms ease, transform 140ms ease;
  }
  .btn-ghost:hover  { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  .btn-ghost:active { transform: scale(0.97); }

  /* ── Sliding pill segmented control (10) ────────────────────────── */
  .pill {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    height: 32px; padding: 0 14px; border-radius: 999px;
    font-size: 13px; color: var(--fg-muted);
    display: inline-flex; align-items: center; gap: 8px;
    white-space: nowrap; position: relative; z-index: 1;
    transition: color 220ms ease;
  }
  .pill:hover  { color: var(--fg); }
  .pill-on     { color: #ffffff; }
  .pill-on:hover { color: #ffffff; }
  .pill-count  {
    font-family: 'Geist Mono', monospace; font-size: 10px;
    color: var(--fg-faint); background: var(--tag-bg);
    padding: 1px 6px; border-radius: 999px;
  }
  .pill-on .pill-count { color: #ffffff; opacity: 0.7; background: rgba(255,255,255,0.18); }
  .pill-group {
    position: relative;
    display: flex; align-items: center; gap: 4px; padding: 4px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--bg-elev); flex-wrap: nowrap;
  }
  .pill-slider {
    position: absolute; top: 4px; bottom: 4px; left: 0;
    background: var(--blue); border-radius: 999px; z-index: 0;
    box-shadow: 0 4px 14px -6px var(--blue);
    width: 0; pointer-events: none;
    transition:
      transform 460ms cubic-bezier(.34,1.4,.6,1),
      width     360ms cubic-bezier(.2,.7,.2,1),
      background 260ms ease,
      opacity    200ms ease;
  }
  .pill-slider.idle { opacity: 0; }

  /* ── 11 · Polyglot greeting ─────────────────────────────────────── */
  .polyglot-hello {
    font-size: clamp(22px, 2.4vw, 28px); line-height: 1.1;
    font-style: italic; font-weight: 400; letter-spacing: -0.02em;
    color: var(--fg-muted); margin: 0 0 18px;
    /* overflow:visible so text is never clipped even at narrow viewports */
    display: inline-flex; align-items: baseline; min-height: 1.1em;
    overflow: visible;
    font-family: 'Geist', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  }
  .polyglot-hello .lang {
    display: inline-block;
    white-space: nowrap; /* prevents text from wrapping or being clipped mid-word */
    transition: opacity 280ms cubic-bezier(.2,.7,.2,1), transform 320ms cubic-bezier(.2,.7,.2,1);
    will-change: opacity, transform;
  }
  .polyglot-hello .lang.swap-out { opacity: 0; transform: translateY(-6px); }
  .polyglot-hello .lang.swap-in  { opacity: 0; transform: translateY(8px);  }
  @media (prefers-reduced-motion: reduce) { .polyglot-hello .lang { transition: none; } }

  /* ── 12 · Drawn SVG underline ───────────────────────────────────── */
  .ulink {
    position: relative; text-decoration: none;
    color: inherit; padding-bottom: 4px;
    display: inline-flex; align-items: center;
  }
  .ulink > .ulink-svg {
    position: absolute; left: 0; right: 0; bottom: -1px;
    width: 100%; height: 8px; overflow: visible; pointer-events: none;
  }
  .ulink > .ulink-svg path {
    stroke: var(--blue); stroke-width: 1.6; fill: none;
    stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220;
    transition: stroke-dashoffset 480ms cubic-bezier(.2,.7,.2,1);
  }
  .ulink:hover > .ulink-svg path,
  .ulink:focus-visible > .ulink-svg path { stroke-dashoffset: 0; }
  .ulink:hover { color: var(--blue-fg); }

  /* ── 06 · Hero spotlight ────────────────────────────────────────── */
  .hero-spotlight { position: relative; isolation: isolate; }
  .hero-spotlight::before {
    content: "";
    position: absolute;
    /* -40px at the top bleeds under the nav; -400px at the bottom lets the
       gradient (520px radius, fades at 65% ≈ 340px) dissolve well below the
       status strip. z-index:3 puts the gradient ON TOP of .shell (z-index:1)
       so it renders over the glass strip instead of being hidden behind it.
       pointer-events:none keeps all interactions intact. */
    inset: -40px 0 -400px 0;
    background: radial-gradient(520px circle at var(--mx,50%) var(--my,30%),
      color-mix(in oklab, var(--blue) 11%, transparent), transparent 65%);
    pointer-events: none; z-index: 3; opacity: 0;
    transition: opacity 320ms ease;
    /* Light theme: normal blend — very subtle 11% tint floats over content */
  }
  html[data-theme="dark"] .hero-spotlight::before {
    background: radial-gradient(560px circle at var(--mx,50%) var(--my,30%),
      color-mix(in oklab, var(--blue) 28%, transparent), transparent 65%);
    /* screen blend: gradient adds luminosity over dark content,
       exactly like a real light source — shines through the glass strip too */
    mix-blend-mode: screen;
  }
  .hero-spotlight.live::before { opacity: 1; }
  /* shell keeps z-index:1 — still above the page background, below ::before */
  .hero-spotlight > .shell { position: relative; z-index: 1; }

  /* ── 01 · Variable headline letters ─────────────────────────────── */
  .vh-l {
    display: inline-block;
    transition:
      font-weight 320ms cubic-bezier(.2,.7,.2,1),
      transform   320ms cubic-bezier(.2,.7,.2,1),
      color       320ms ease;
    will-change: font-weight, transform;
  }

  /* ── 08 · Featured card tilt + sheen ────────────────────────────── */
  .featured { transform-style: preserve-3d; }
  .featured-sheen {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(260px circle at var(--sx,50%) var(--sy,50%),
      rgba(255,255,255,0.22), transparent 60%);
    opacity: 0; transition: opacity 240ms ease; z-index: 3;
    mix-blend-mode: soft-light;
  }
  html[data-theme="dark"] .featured-sheen {
    background: radial-gradient(280px circle at var(--sx,50%) var(--sy,50%),
      rgba(255,255,255,0.16), transparent 60%);
    mix-blend-mode: screen;
  }
  .featured.is-tilting:hover .featured-sheen { opacity: 1; }

  /* ── Available badge ────────────────────────────────────────────── */
  .available-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-elev);
    font-size: 13px; color: var(--fg-muted); white-space: nowrap;
  }
  @keyframes pulse { 0%{transform:scale(1);opacity:0.45} 100%{transform:scale(2.2);opacity:0} }

  /* ── Command palette ────────────────────────────────────────────── */
  .cmdk-back {
    position: fixed; inset: 0; z-index: 100;
    background: color-mix(in oklab, var(--bg) 50%, transparent);
    backdrop-filter: saturate(140%) blur(8px);
    -webkit-backdrop-filter: saturate(140%) blur(8px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 12vh 16px 0;
    animation: cmdkBack 180ms ease-out;
  }
  @keyframes cmdkBack { from{opacity:0} to{opacity:1} }
  .cmdk-modal {
    width: 100%; max-width: 580px;
    border: 1px solid var(--border-strong); background: var(--bg-elev);
    border-radius: 14px;
    box-shadow: 0 32px 80px -28px rgba(0,0,0,0.35);
    overflow: hidden;
    animation: cmdkPop 220ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes cmdkPop {
    from { opacity:0; transform:translateY(-8px) scale(.98); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }
  .cmdk-mod-input {
    width:100%; border:0; outline:0;
    padding:16px 18px; background:transparent; color:var(--fg);
    font-size:15px; letter-spacing:-0.005em;
    border-bottom:1px solid var(--border);
  }
  .cmdk-mod-input::placeholder { color:var(--fg-faint); }
  .cmdk-mod-list  { padding:8px; max-height:320px; overflow-y:auto; }
  .cmdk-empty     { padding:28px 16px; text-align:center; color:var(--fg-faint); font-size:13px; font-family:'Geist Mono',monospace; }
  .cmdk-mod-item  {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:8px;
    font-size:14px; color:var(--fg); cursor:pointer;
    transition:background 100ms ease;
  }
  .cmdk-mod-item.sel          { background:var(--blue-soft); color:var(--blue-fg); }
  .cmdk-mod-icon  {
    width:22px; height:22px; border-radius:5px;
    background:var(--tag-bg); display:inline-flex; align-items:center; justify-content:center;
    font-family:'Geist Mono',monospace; font-size:11px; color:var(--fg-muted); flex-shrink:0;
  }
  .cmdk-mod-item.sel .cmdk-mod-icon { background:color-mix(in oklab,var(--blue) 20%,transparent); color:var(--blue-fg); }
  .cmdk-mod-label { flex:1; }
  .cmdk-mod-group {
    font-family:'Geist Mono',monospace; font-size:10px; color:var(--fg-faint);
    text-transform:uppercase; letter-spacing:.06em;
  }
  .cmdk-mod-item.sel .cmdk-mod-group { color:var(--blue-fg); opacity:0.75; }
  .cmdk-mod-kbd   {
    font-family:'Geist Mono',monospace; font-size:10px; color:var(--fg-muted);
    background:var(--bg-soft); border:1px solid var(--border);
    padding:2px 6px; border-radius:4px;
  }
  .cmdk-mod-foot  {
    display:flex; gap:14px; padding:8px 14px;
    border-top:1px solid var(--border);
    font-family:'Geist Mono',monospace; font-size:10px; color:var(--fg-faint);
    background:var(--bg-soft);
  }
  .cmdk-mod-foot kbd {
    display:inline-block; background:var(--bg-elev); border:1px solid var(--border);
    padding:1px 5px; border-radius:3px; font-size:10px; color:var(--fg-muted); margin-right:3px;
  }

  /* Command palette trigger in nav */
  .cmdk-trigger {
    display:inline-flex; align-items:center; gap:8px;
    height:36px; padding:0 10px 0 12px; border-radius:8px;
    border:1px solid var(--border); background:var(--bg-elev);
    font-size:12px; color:var(--fg-muted); cursor:pointer;
    transition:background 160ms ease,border-color 160ms ease,color 160ms ease;
  }
  .cmdk-trigger:hover { background:var(--blue-soft); border-color:var(--blue); color:var(--blue-fg); }
  .cmdk-trigger kbd {
    font-family:'Geist Mono',monospace; font-size:10px;
    background:var(--bg-soft); border:1px solid var(--border);
    padding:1px 5px; border-radius:4px; color:var(--fg-muted);
  }
  .cmdk-trigger:hover kbd { background:var(--bg-elev); border-color:var(--blue); color:var(--blue-fg); }
  @media (max-width:640px) { .cmdk-trigger span.label { display:none; } }

  /* ── Responsive nav ─────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .nav-links .nav-link { padding: 8px 8px; font-size: 13px; }
    .nav-right .cv-btn span { display: none; }
  }

  /* ── 15 · Accent colour picker ──────────────────────────────────── */
  /* Button: same dimensions as icon-btn, shows live accent dot        */
  .accent-btn {
    width: 36px; height: 36px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: var(--bg-elev);
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, transform 120ms ease;
    position: relative;
  }
  .accent-btn:hover  { background: var(--blue-soft); border-color: var(--blue); }
  .accent-btn:active { transform: scale(0.94); }
  /* The live accent dot inside the button */
  .accent-btn-dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 0 0 var(--blue);
    transition: box-shadow 220ms ease;
    flex-shrink: 0;
  }
  .accent-btn[aria-expanded="true"] .accent-btn-dot {
    box-shadow: 0 0 0 2.5px var(--bg-elev), 0 0 0 4px var(--blue);
  }

  /* Glass popover */
  .accent-pop {
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: color-mix(in oklab, var(--bg-elev) 82%, transparent);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid color-mix(in oklab, var(--border-strong) 55%, transparent);
    border-radius: 14px;
    box-shadow:
      0 12px 40px -16px rgba(0,0,0,0.22),
      inset 0 1px 0 rgba(255,255,255,0.18);
    z-index: 200;
    animation: accentPop 200ms cubic-bezier(.2,.7,.2,1) both;
    min-width: 0;
  }
  html[data-theme="dark"] .accent-pop {
    box-shadow:
      0 12px 40px -16px rgba(0,0,0,0.65),
      inset 0 1px 0 rgba(255,255,255,0.06);
  }
  @keyframes accentPop {
    from { opacity:0; transform:translateY(-6px) scale(.95); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }

  /* Row of swatches */
  .accent-swatches { display: flex; align-items: center; gap: 6px; padding: 2px 2px; }

  /* Each swatch */
  .accent-swatch {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer; padding: 0; flex-shrink: 0;
    transition: transform 180ms cubic-bezier(.2,.7,.2,1), box-shadow 180ms ease;
    outline: none;
  }
  .accent-swatch:hover  { transform: scale(1.18); }
  .accent-swatch:active { transform: scale(0.95); }
  .accent-swatch.on {
    box-shadow: 0 0 0 2px var(--bg-elev), 0 0 0 4px var(--swatch, var(--blue));
  }

  /* Auto swatch: conic gradient of the 4 time-of-day hues */
  .accent-swatch-auto {
    background: conic-gradient(
      #ea7c2c 0deg 90deg,
      #2563eb 90deg 180deg,
      #dc2626 180deg 270deg,
      #7c3aed 270deg 360deg
    );
  }
  .accent-swatch-auto.on {
    box-shadow: 0 0 0 2px var(--bg-elev), 0 0 0 4px var(--fg-faint);
  }

  /* Label row under swatches */
  .accent-label {
    font-family: 'Geist Mono', monospace;
    font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--fg-faint); text-align: center;
    padding: 0 4px 2px;
    transition: color 160ms ease;
  }
</style>

<!-- ── Time-of-day accent (14) + nav scroll detector ────────────────── -->
<!-- Runs before React to avoid a flash of the wrong accent color.       -->
<script>
(function() {
  // 14 — Shift --blue/--blue-fg/--blue-soft based on local hour.
  // Manual accent (ao-accent-manual) overrides time-of-day when set.
  // dawn 5-9 (amber) · day 9-17 (blue) · dusk 17-21 (red) · night 21-5 (violet)
  var MANUAL_PALETTES = {
    blue:    { l:['#2563eb','#1d4ed8','#eff6ff'], d:['#60a5fa','#93c5fd','#0b1a33'] },
    violet:  { l:['#7c3aed','#6d28d9','#f3efff'], d:['#a78bfa','#c4b5fd','#15102a'] },
    rose:    { l:['#e11d48','#be123c','#fff1f2'], d:['#fb7185','#fda4af','#1f0a0d'] },
    amber:   { l:['#d97706','#b45309','#fffbeb'], d:['#fb923c','#fdba74','#1f1206'] },
    emerald: { l:['#059669','#047857','#ecfdf5'], d:['#34d399','#6ee7b7','#0a1f17'] },
    cyan:    { l:['#0891b2','#0e7490','#ecfeff'], d:['#22d3ee','#67e8f9','#0a1f26'] },
  };

  function applyAccent() {
    var dark = document.documentElement.getAttribute('data-theme')==='dark';
    // Manual override wins — user picked a specific color.
    var manual = localStorage.getItem('ao-accent-manual');
    if (manual && manual !== 'auto' && MANUAL_PALETTES[manual]) {
      var mp = MANUAL_PALETTES[manual][dark?'d':'l'];
      document.documentElement.style.setProperty('--blue',      mp[0]);
      document.documentElement.style.setProperty('--blue-fg',   mp[1]);
      document.documentElement.style.setProperty('--blue-soft', mp[2]);
      return;
    }
    // Auto (default): time-of-day palette.
    var h = new Date().getHours();
    var period;
    if      (h>=5  && h<9)  period='dawn';
    else if (h>=9  && h<17) period='day';
    else if (h>=17 && h<21) period='dusk';
    else                    period='night';
    var palettes = {
      dawn:  { l:['#ea7c2c','#c2410c','#fff4e6'], d:['#fb923c','#fdba74','#1f1206'] },
      day:   { l:['#2563eb','#1d4ed8','#eff6ff'], d:['#60a5fa','#93c5fd','#0b1a33'] },
      dusk:  { l:['#dc2626','#b91c1c','#fee2e2'], d:['#f87171','#fca5a5','#2a0a0a'] },
      night: { l:['#7c3aed','#6d28d9','#f3efff'], d:['#a78bfa','#c4b5fd','#15102a'] },
    };
    var p = palettes[period][dark?'d':'l'];
    document.documentElement.style.setProperty('--blue',      p[0]);
    document.documentElement.style.setProperty('--blue-fg',   p[1]);
    document.documentElement.style.setProperty('--blue-soft', p[2]);
  }

  // Apply on first paint, then refresh every hour and on theme change.
  applyAccent();
  setInterval(applyAccent, 60*60*1000);
  new MutationObserver(applyAccent).observe(
    document.documentElement,
    { attributes:true, attributeFilter:['data-theme'] }
  );
  window.__refreshAccent = applyAccent;

  // Liquid glass nav — add .scrolled class when user scrolls down.
  function onScroll() {
    var n = document.querySelector('.nav');
    if (!n) return;
    if (window.scrollY > 8) n.classList.add('scrolled');
    else n.classList.remove('scrolled');
  }
  window.addEventListener('scroll', onScroll, { passive:true });
  // Apply once DOM is ready
  document.addEventListener('DOMContentLoaded', function(){ setTimeout(onScroll, 100); });

  // Respect system preference on first visit (no saved theme yet).
  // This runs synchronously so there's no flash.
  if (!localStorage.getItem('ao-theme')) {
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  } else {
    document.documentElement.setAttribute('data-theme', localStorage.getItem('ao-theme'));
  }
})();
</script>
