<style>
  /* ── CSS custom properties ─────────────────────────────────────── */
  :root {
    /* Light theme */
    --bg:              #f9f7f3;
    --bg-soft:         #fafaf9;
    --bg-elev:         #ffffff;
    --fg:              #0a0a0a;
    --fg-muted:        #71717a;
    --fg-faint:        #a1a1aa;
    --border:          #e7e5e4;
    --border-strong:   #d6d3d1;
    --hover:           #f5f5f4;
    --accent:          #0a0a0a;
    --accent-fg:       #ffffff;
    --available:       #16a34a;
    --blue:            #2563eb;
    --blue-soft:       #eff6ff;
    --blue-fg:         #1d4ed8;
    --tag-bg:          #f5f5f4;
    --shadow:          0 1px 0 rgba(0,0,0,0.04), 0 8px 24px -12px rgba(0,0,0,0.08);
    --shadow-lg:       0 1px 0 rgba(0,0,0,0.04), 0 24px 60px -24px rgba(0,0,0,0.12);
  }
  html[data-theme="dark"] {
    --bg:              #0a0a0a;
    --bg-soft:         #0e0e0e;
    --bg-elev:         #131313;
    --fg:              #fafafa;
    --fg-muted:        #a1a1aa;
    --fg-faint:        #71717a;
    --border:          #1f1f1f;
    --border-strong:   #2a2a2a;
    --hover:           #161616;
    --accent:          #fafafa;
    --accent-fg:       #0a0a0a;
    --available:       #4ade80;
    --blue:            #60a5fa;
    --blue-soft:       #0b1a33;
    --blue-fg:         #93c5fd;
    --tag-bg:          #161616;
    --shadow:          0 1px 0 rgba(255,255,255,0.02), 0 8px 24px -12px rgba(0,0,0,0.6);
    --shadow-lg:       0 1px 0 rgba(255,255,255,0.02), 0 24px 60px -24px rgba(0,0,0,0.7);
  }

  /* ── Reset & base ───────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background: var(--bg); color: var(--fg); }
  body {
    font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-feature-settings: "ss01", "ss03", "cv11";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    transition: background 200ms ease, color 200ms ease;
  }
  ::selection { background: var(--fg); color: var(--bg); }
  a { color: inherit; }
  button { font-family: inherit; }
  textarea, input { font-family: inherit; }
  .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── Layout ─────────────────────────────────────────────────────── */
  .shell { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px) { .shell { padding: 0 26px; } }

  /* ── Liquid glass nav (01) ──────────────────────────────────────── */
  /* Reading progress — a hairline accent bar at the very top edge that fills
     with scroll depth. Sits above the floating nav pill; GPU-transform only. */
  .read-progress {
    position: fixed; top: 0; left: 0; right: 0; height: 2px;
    z-index: 60; pointer-events: none;
    transform-origin: 0 50%;
    transform: scaleX(var(--p, 0));
    background: linear-gradient(90deg,
      color-mix(in oklab, var(--blue) 55%, transparent), var(--blue));
    box-shadow: 0 0 10px -1px var(--blue);
    will-change: transform;
    transition: opacity 240ms ease;
  }
  .read-progress.at-top { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .read-progress { display: none; } }

  /* Back-to-top — a floating glass pill that fades in once you've scrolled past
     the first screen, and glides the page back up. Hidden (and unfocusable)
     until shown. Sits clear of the mobile bottom nav on small screens. */
  .to-top {
    position: fixed; z-index: 55;
    right: 24px; bottom: 24px;
    width: 44px; height: 44px; border-radius: 999px;
    display: grid; place-items: center;
    color: var(--fg); cursor: pointer;
    border: 1px solid color-mix(in oklab, var(--border-strong) 55%, transparent);
    background: color-mix(in oklab, var(--bg-elev) 55%, transparent);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 12px 30px -14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
    opacity: 0; transform: translateY(12px) scale(.92); pointer-events: none;
    transition: opacity 260ms ease, transform 260ms cubic-bezier(.2,.7,.2,1),
                background 200ms ease, border-color 200ms ease, color 200ms ease;
  }
  html[data-theme="dark"] .to-top {
    box-shadow: 0 12px 30px -14px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .to-top.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
  .to-top.show:hover {
    color: var(--blue-fg); border-color: var(--blue); background: var(--blue-soft);
    transform: translateY(-3px) scale(1.05);
  }
  .to-top svg { width: 18px; height: 18px; transform: rotate(180deg); }
  @media (max-width: 640px) {
    .to-top {
      right: 16px;
      bottom: calc(56px + env(safe-area-inset-bottom, 0px) + 16px);
      width: 42px; height: 42px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .to-top { transition: opacity 200ms ease; transform: none; }
    .to-top.show, .to-top.show:hover { transform: none; }
  }

  .nav {
    position: sticky; top: 0; z-index: 50;
    background: transparent; border-bottom: 0;
    padding: 12px 0 8px;
    transition: padding 220ms ease;
    pointer-events: none;
  }
  .nav-inner {
    pointer-events: auto;
    height: 56px;
    padding: 0 8px 0 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px;
    border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--border-strong) 55%, transparent);
    /* Liquid glass: low base opacity so page content reads through, lifted by
       a heavy blur + saturation boost and a bright top-edge highlight. */
    background: color-mix(in oklab, var(--bg-elev) 18%, transparent);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    box-shadow:
      0 14px 40px -20px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 0 rgba(0,0,0,0.04);
    transition: background 220ms ease, border-color 220ms ease, box-shadow 220ms ease,
                max-width 260ms cubic-bezier(.2,.7,.2,1);
  }
  html[data-theme="dark"] .nav-inner {
    background: color-mix(in oklab, var(--bg-elev) 24%, transparent);
    box-shadow:
      0 14px 40px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  /* Once scrolled, the pill draws in from the sides: its max width shrinks so it
     narrows toward the centre, and its glass firms up for legibility over busy
     content — but stays translucent so it still reads as glass. */
  .nav.scrolled .nav-inner {
    max-width: 860px;
    background: color-mix(in oklab, var(--bg-elev) 40%, transparent);
    box-shadow:
      0 16px 44px -20px rgba(0,0,0,0.24),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 0 rgba(0,0,0,0.04);
  }
  html[data-theme="dark"] .nav.scrolled .nav-inner {
    background: color-mix(in oklab, var(--bg-elev) 44%, transparent);
    box-shadow:
      0 16px 44px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  /* Full-width phones: keep the pill edge-to-edge (no side narrowing). */
  @media (max-width: 640px) { .nav.scrolled .nav-inner { max-width: none; } }

  /* Brand */
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
    color: var(--fg); text-decoration: none; cursor: pointer;
    background: none; border: 0; padding: 0;
  }
  /* Brand monogram — takes the active accent (var(--blue)) and echoes the old
     square's playful tilt + glow on hover. */
  .brand-mark {
    height: 18px; width: auto; display: block; color: var(--blue);
    transform-origin: 55% 60%;
    transition: transform 260ms cubic-bezier(.34,1.3,.5,1);
  }
  .brand:hover .brand-mark { transform: rotate(-8deg) scale(1.12); }
  .brand:active .brand-mark { transform: rotate(-4deg) scale(1.03); }

  /* Nav links */
  .nav-links { position: relative; display: flex; align-items: center; gap: 2px; }
  .nav-link {
    position: relative; appearance: none; background: transparent; border: 0;
    color: var(--fg-muted); cursor: pointer;
    font-size: 14px; padding: 8px 12px; border-radius: 8px;
    letter-spacing: -0.005em;
    transition: color 160ms ease, background 160ms ease;
  }
  .nav-link:hover  { color: var(--fg); }
  .nav-link.active { color: var(--fg); }

  /* Sliding underline indicator — single element that glides between links */
  .nav-indicator {
    position: absolute; bottom: 3px; height: 2px;
    background: var(--blue); border-radius: 999px;
    pointer-events: none; z-index: 1;
    box-shadow: 0 0 8px -2px var(--blue);
    transition:
      left    380ms cubic-bezier(.34,1.15,.6,1),
      width   300ms cubic-bezier(.2,.7,.2,1),
      opacity 200ms ease;
  }
  .nav-indicator.hidden { opacity: 0; }

  /* Nav right */
  .nav-right { display: flex; align-items: center; gap: 8px; }

  /* Icon button (theme toggle) — circular to echo the rounded glass nav */
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: var(--bg-elev);
    color: var(--fg); cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
  }
  .icon-btn:hover  { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  .icon-btn:active { transform: scale(0.94) rotate(-10deg); }
  .icon-btn svg { width: 16px; height: 16px; }

  /* Morphing sun ↔ moon toggle icon. Sun (light): full disc + splayed rays.
     Moon (dark, .is-dark): a mask "bite" slides in to carve a crescent and the
     rays retract to the centre. transform-box:view-box keeps translations in
     the 0–24 SVG coordinate space across browsers. */
  .theme-icon { width: 18px; height: 18px; overflow: visible; }
  .theme-icon .ti-bite,
  .theme-icon .ti-rays,
  .theme-icon .ti-core {
    transform-box: view-box;
    transform-origin: 12px 12px;
  }
  /* The moon reads bigger than the sun: the disc grows once the crescent forms. */
  .theme-icon .ti-core {
    transform: scale(1);
    transition: transform 480ms cubic-bezier(.5,0,.15,1);
  }
  .theme-icon.is-dark .ti-core { transform: scale(1.45); }
  .theme-icon .ti-bite {
    /* parked far up-right → no overlap → full sun disc */
    transform: translate(9px, -9px);
    transition: transform 520ms cubic-bezier(.5,0,.15,1);
  }
  .theme-icon .ti-rays {
    opacity: 1; transform: scale(1) rotate(0deg);
    transition: opacity 300ms ease, transform 480ms cubic-bezier(.34,1.4,.5,1);
  }
  .theme-icon .ti-rays path {
    transition: stroke-width 300ms ease;
  }
  /* Dark: bite slides over the disc to bite out a crescent; rays collapse. */
  .theme-icon.is-dark .ti-bite  { transform: translate(2.5px, -3.5px); }
  .theme-icon.is-dark .ti-rays  { opacity: 0; transform: scale(.35) rotate(-45deg); }
  @media (prefers-reduced-motion: reduce) {
    .theme-icon .ti-bite, .theme-icon .ti-rays, .theme-icon .ti-rays path {
      transition-duration: 1ms;
    }
  }

  /* CV button — pill-shaped so its corner matches the rounded nav edge */
  .cv-btn {
    display: inline-flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-elev);
    font-size: 13px; color: var(--fg); cursor: pointer; text-decoration: none;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
  }
  .cv-btn:hover  { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  .cv-btn:hover svg { transform: translateY(2px); }
  .cv-btn svg { width: 14px; height: 14px; transition: transform 200ms cubic-bezier(.2,.7,.2,1); }
  .cv-btn:active { transform: scale(0.97); }
  /* Draw-on flourish: on hover the download glyph redraws itself, arrow first
     then the base line, via stroke-dashoffset. Rests fully drawn (offset 0). */
  .cv-btn svg path { stroke-dasharray: 40; stroke-dashoffset: 0; }
  .cv-btn:hover svg path { animation: cv-draw 560ms cubic-bezier(.6,0,.2,1) both; }
  .cv-btn:hover svg path:nth-child(2) { animation-delay: 140ms; }
  @keyframes cv-draw {
    from { stroke-dashoffset: 40; }
    to   { stroke-dashoffset: 0;  }
  }
  @media (prefers-reduced-motion: reduce) {
    .cv-btn:hover svg path { animation: none; }
  }

  /* CV language menu — clicking the CV pill opens a small popover to pick the
     language (English / French / Dutch). */
  .cv-wrap { position: relative; display: inline-flex; }
  .cv-btn.is-open { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  /* Liquid glass — same recipe as the nav pill (heavy blur + saturation and a
     bright top-edge highlight), but nearly opaque so the menu stays fully
     legible over page content. */
  .cv-pop {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 70;
    display: flex; flex-direction: column; gap: 2px; padding: 6px; min-width: 154px;
    border-radius: 14px;
    background: color-mix(in oklab, var(--bg-elev) 96%, transparent);
    backdrop-filter: blur(28px) saturate(200%);
    -webkit-backdrop-filter: blur(28px) saturate(200%);
    border: 1px solid color-mix(in oklab, var(--border-strong) 55%, transparent);
    box-shadow:
      0 14px 40px -20px rgba(0,0,0,0.18),
      inset 0 1px 0 rgba(255,255,255,0.45),
      inset 0 -1px 0 rgba(0,0,0,0.04);
    animation: cv-pop-in 160ms cubic-bezier(.2,.7,.2,1);
  }
  html[data-theme="dark"] .cv-pop {
    box-shadow:
      0 14px 40px -20px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  @keyframes cv-pop-in { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }
  .cv-pop-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px;
    text-decoration: none; color: var(--fg); font-size: 13px;
    transition: background 140ms ease;
  }
  .cv-pop-item:hover { background: color-mix(in oklab, var(--fg) 8%, transparent); }
  .cv-pop-lang { font-size: 11px; color: var(--fg-muted); min-width: 22px; }
  @media (prefers-reduced-motion: reduce) { .cv-pop { animation: none; } }

  /* ── Page transitions ───────────────────────────────────────────── */
  /* Clean fade + tiny rise — no blur (it muddied the boot→page reveal). */
  .page-enter { animation: pageIn 420ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0);   }
  }
  /* On the very first load the boot splash IS the intro, so the home page
     must NOT also run its enter animation underneath the fading splash —
     that overlap is what looked messy. We suppress it until the first nav. */
  .app-no-enter .page-enter { animation: none; }
  @media (prefers-reduced-motion: reduce) { .page-enter { animation: none; } }

  /* ── Footer ─────────────────────────────────────────────────────── */
  /* Full-bleed accent panel. Background follows the user-chosen accent
     (--blue), so it restyles itself when the accent picker changes. Text
     is forced white since the accent is always a saturated colour. */
  .foot {
    width: min(1240px, calc(100% - 48px));
    margin: 112px auto 0;
    padding: 0 clamp(18px, 3vw, 40px);
    border-radius: 30px 30px 0 0;
    /* Subtle fade — the top stays the exact accent (so trunks blend), easing a
       touch lighter toward the bottom. */
    background: linear-gradient(180deg,
      var(--blue) 0%,
      color-mix(in oklab, var(--blue) 85%, #fff) 100%);
    color: #fff;
    position: relative;
    overflow: visible;
    transition: background 320ms ease;
  }

  /* Fir forest on the top edge + the sheen. The sheen (z-index 3) paints above
     the firs (z-index 2), so a trunk that dips onto the slab takes the same
     sheen and blends in seamlessly; foliage above the edge stays vivid. */
  .foot-sheen {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    border-radius: inherit;
    background: radial-gradient(120% 80% at 50% -25%, rgba(255,255,255,.20), transparent 60%);
  }
  .foot-forest {
    position: absolute; left: 0; right: 0; top: -112px; height: 134px;
    z-index: 2; overflow: hidden; pointer-events: none; color: var(--blue);
  }
  .foot-forest-row {
    position: absolute; left: 50%; bottom: 20px;
    transform: translateX(-50%); transform-origin: bottom center;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .fir {
    position: relative; margin-left: -10px; cursor: pointer;
    pointer-events: auto; transform-origin: 50% 100%;
    animation: fir-sway 6s ease-in-out infinite;
  }
  .fir:first-child     { margin-left: 0; }
  .fir:nth-child(2n)   { animation-duration: 7.2s; animation-delay: -1.3s; }
  .fir:nth-child(3n)   { animation-duration: 5.4s; animation-delay: -0.7s; }
  .fir:nth-child(4n)   { animation-duration: 6.6s; animation-delay: -2.1s; }
  .fir-front { z-index: 2; }
  .fir-back  { z-index: 0; }
  .fir-tree, .fir-twig { display: block; transform-origin: 50% 100%; }
  .foot-forest svg     { display: block; }   /* kill the inline-SVG baseline gap */
  .fir-back .fir-tree  { transform: scale(0.8); opacity: 0.5; }
  .fir-twig            { transition: transform 0.8s ease-out; }
  .fir:hover           { z-index: 6; }
  .fir:hover .fir-twig { animation: fir-gust 2.4s ease-in-out infinite; }
  @keyframes fir-sway { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
  @keyframes fir-gust { 0%, 100% { transform: rotate(-4.5deg); } 50% { transform: rotate(4.5deg); } }
  @media (prefers-reduced-motion: reduce) {
    .fir, .fir:hover .fir-twig { animation: none; }
    .fir-twig { transition: none; }
  }
  .foot-inner {
    position: relative; z-index: 4;
    padding: 34px 0 26px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  /* Top meta row — last updated / currently */
  .foot-meta {
    width: 100%;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  .foot-col       { display: flex; flex-direction: column; gap: 4px; }
  .foot-col-right { align-items: flex-end; text-align: right; }
  .foot-eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(255,255,255,.62);
  }
  .foot-meta-val { font-size: 13px; color: #fff; letter-spacing: -0.01em; }

  /* Centre note — framed in a soft frosted card so it reads as a little
     signed message rather than loose body text. */
  .foot-note {
    position: relative;
    margin: 2px 0 0; max-width: 680px;
    /* Wider, shorter box: the text wraps over fewer lines so the card takes
       less height. Extra bottom padding still leaves room for the social tiles
       to overlap the lower edge without ever touching the text. */
    padding: 16px 28px 58px;
    border-radius: 16px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.22);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 16px 40px -24px rgba(0,0,0,.55);
    text-align: left;
  }
  .foot-note-label {
    display: block; margin-bottom: 8px;
    font-family: 'Geist Mono', monospace;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(255,255,255,.6);
  }
  .foot-note-text {
    margin: 0; font-size: 16px; line-height: 1.55; letter-spacing: -0.01em;
    color: rgba(255,255,255,.96);
  }
  .foot-note-text a {
    color: #fff; text-decoration: underline; text-underline-offset: 3px;
    text-decoration-thickness: 1px;
    transition: opacity 180ms ease;
  }
  .foot-note-text a:hover { opacity: .8; }

  /* Interactive social tiles — large, overlapping, and lifted up so they
     ride over the bottom edge of the note card (the hero element). */
  .foot-socials {
    display: flex; gap: 0;
    position: relative; z-index: 2;
    margin-top: -58px;   /* pull the row up to overlap the card's lower edge */
  }
  .foot-tile {
    width: 106px; height: 106px; border-radius: 27px;
    display: grid; place-items: center;
    color: #fff; text-decoration: none;
    border: 2px solid rgba(255,255,255,.6);
    background: var(--blue);   /* solid so overlapping tiles read as stacked, not see-through */
    position: relative; z-index: 1;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.5);
    /* gentle resting tilt, alternating around the centre tile */
    transform: rotate(calc((var(--i) - 1) * 4deg));
    transition: transform 280ms cubic-bezier(.34,1.56,.64,1),
                background 220ms ease, color 220ms ease,
                border-color 220ms ease, box-shadow 280ms ease;
  }
  .foot-tile + .foot-tile { margin-left: -24px; }   /* overlap neighbours */
  .foot-tile { cursor: pointer; }
  /* Mail tile confirms the copy: a floating pill rises above it, and the tile
     briefly flips to the accent-on-white "success" look. */
  .foot-tile.copied {
    background: #fff; color: var(--blue); border-color: #fff;
  }
  .foot-tile-toast {
    position: absolute; left: 50%; top: -6px;
    transform: translate(-50%, 0);
    padding: 4px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .01em;
    background: #fff; color: var(--blue);
    box-shadow: 0 8px 20px -8px rgba(0,0,0,.5);
    white-space: nowrap; pointer-events: none;
    opacity: 0; z-index: 6;
    animation: foot-toast 1500ms ease both;
  }
  @keyframes foot-toast {
    0%   { opacity: 0; transform: translate(-50%, 6px) scale(.9); }
    15%  { opacity: 1; transform: translate(-50%, -14px) scale(1); }
    80%  { opacity: 1; transform: translate(-50%, -16px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -22px) scale(.96); }
  }
  @media (prefers-reduced-motion: reduce) {
    .foot-tile-toast { animation: none; opacity: 1; transform: translate(-50%, -16px); }
  }
  .foot-tile svg {
    width: 48px; height: 48px;
    transition: transform 280ms cubic-bezier(.34,1.56,.64,1);
  }
  .foot-tile:hover {
    z-index: 5;   /* hovered tile rises above its overlapping neighbours */
    transform: translateY(-12px) rotate(calc((var(--i) - 1) * 4deg)) scale(1.1);
    background: #fff; color: var(--blue); border-color: #fff;
    box-shadow: 0 22px 40px -14px rgba(0,0,0,.5);
  }
  .foot-tile:hover svg { transform: scale(1.08); }
  .foot-tile:active    { transform: translateY(-5px) scale(1.04); }

  /* Base row — brand + copyright */
  .foot-base {
    width: 100%; margin-top: 2px; padding-top: 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border-top: 1px solid rgba(255,255,255,.18);
  }
  .foot-brand {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500; letter-spacing: -0.01em; color: #fff;
  }
  .foot-mark {
    height: 15px; width: auto; color: #fff; display: block;
    flex-shrink: 0; transform-origin: 55% 60%;
    transition: transform 260ms cubic-bezier(.34,1.3,.5,1);
  }
  .foot-brand:hover .foot-mark { transform: rotate(-8deg) scale(1.15); }
  .foot-mid { font-size: 11px; color: rgba(255,255,255,.62); letter-spacing: 0.01em; }
  @media (max-width: 640px) {
    /* The base .foot-inner sets `padding: 34px 0` which zeroes the horizontal
       gutter and beats .shell — so set an explicit side gutter here. */
    .foot-inner     { padding: 28px 26px 26px; gap: 18px; }
    /* A narrower, centred cluster (fewer firs, smaller) so the forest sits on
       the slab like on desktop instead of filling the whole width. */
    .foot-forest    { top: -72px; height: 94px; }
    .foot-forest-row{ transform: translateX(-50%) scale(0.56); }
    .fir:nth-child(n+13) { display: none; }
    .foot-mid       { display: none; }   /* keep one tidy line on narrow screens */
    .foot-note      { padding: 16px 22px 52px; }
    .foot-note-text { font-size: 15px; }
    .foot-socials   { margin-top: -50px; }
    .foot-tile      { width: 86px; height: 86px; border-radius: 22px; }
    .foot-tile + .foot-tile { margin-left: -18px; }
    .foot-tile svg  { width: 38px; height: 38px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .foot-tile, .foot-tile svg { transition: background 220ms ease, color 220ms ease; }
    .foot-tile:hover { transform: rotate(calc((var(--i) - 1) * 3deg)); }
  }

  /* ── Typography utilities ───────────────────────────────────────── */
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg-muted);
  }
  .h1 {
    font-size: clamp(48px, 7vw, 88px); line-height: 0.98;
    letter-spacing: -0.035em; font-weight: 500; margin: 0;
  }
  .h2 {
    font-size: 40px; line-height: 1.05; letter-spacing: -0.025em;
    font-weight: 500; margin: 0;
  }
  .sub {
    color: var(--fg-muted); font-size: 16px; line-height: 1.55;
    letter-spacing: -0.005em;
  }
  .divider { height: 1px; background: var(--border); border: 0; }

  /* ── Shared buttons ─────────────────────────────────────────────── */
  .btn-primary {
    position: relative; overflow: hidden;
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 20px; border-radius: 10px;
    background: var(--accent); color: var(--accent-fg);
    border: 1px solid var(--accent);
    font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 0 0 0 var(--blue);
    transition: transform 140ms ease, box-shadow 240ms ease, background 200ms ease, border-color 200ms ease;
  }
  .btn-primary:hover {
    background: var(--blue); border-color: var(--blue);
    box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 8px 24px -8px var(--blue);
  }
  .btn-primary:hover svg { transform: translateX(4px); }
  .btn-primary svg { width: 14px; height: 14px; transition: transform 220ms cubic-bezier(.2,.7,.2,1); }
  .btn-primary:active { transform: scale(0.97); }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 20px; border-radius: 10px;
    background: var(--bg-elev); color: var(--fg);
    border: 1px solid var(--border);
    font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background 200ms ease, border-color 200ms ease, color 200ms ease, transform 140ms ease;
  }
  .btn-ghost:hover  { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  .btn-ghost:active { transform: scale(0.97); }

  /* ── Sliding pill segmented control (10) ────────────────────────── */
  .pill {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    height: 32px; padding: 0 14px; border-radius: 999px;
    font-size: 13px; color: var(--fg-muted);
    display: inline-flex; align-items: center; gap: 8px;
    white-space: nowrap; position: relative; z-index: 1;
    transition: color 220ms ease;
  }
  .pill:hover  { color: var(--fg); }
  .pill-on     { color: #ffffff; }
  .pill-on:hover { color: #ffffff; }
  .pill-count  {
    font-family: 'Geist Mono', monospace; font-size: 10px;
    color: var(--fg-faint); background: var(--tag-bg);
    padding: 1px 6px; border-radius: 999px;
  }
  .pill-on .pill-count { color: #ffffff; opacity: 0.7; background: rgba(255,255,255,0.18); }
  .pill-group {
    position: relative;
    display: flex; align-items: center; gap: 4px; padding: 4px;
    flex-wrap: nowrap;
    /* Liquid glass: translucent + blurred so content shows through, with a
       bright top-edge highlight, matching the nav. */
    border: 1px solid color-mix(in oklab, var(--border-strong) 55%, transparent);
    border-radius: 999px;
    background: color-mix(in oklab, var(--bg-elev) 24%, transparent);
    backdrop-filter: blur(24px) saturate(190%);
    -webkit-backdrop-filter: blur(24px) saturate(190%);
    box-shadow:
      0 8px 24px -16px rgba(0,0,0,0.16),
      inset 0 1px 0 rgba(255,255,255,0.4),
      inset 0 -1px 0 rgba(0,0,0,0.04);
  }
  html[data-theme="dark"] .pill-group {
    background: color-mix(in oklab, var(--bg-elev) 28%, transparent);
    box-shadow:
      0 8px 24px -16px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.07),
      inset 0 -1px 0 rgba(0,0,0,0.2);
  }
  .pill-slider {
    position: absolute; top: 4px; bottom: 4px; left: 0;
    background: var(--blue); border-radius: 999px; z-index: 0;
    box-shadow: 0 4px 14px -6px var(--blue);
    width: 0; pointer-events: none;
    transition:
      transform 460ms cubic-bezier(.34,1.4,.6,1),
      width     360ms cubic-bezier(.2,.7,.2,1),
      background 260ms ease,
      opacity    200ms ease;
  }
  .pill-slider.idle { opacity: 0; }

  /* ── 11 · Polyglot greeting ─────────────────────────────────────── */
  .polyglot-hello {
    font-size: clamp(22px, 2.4vw, 28px); line-height: 1.1;
    font-style: italic; font-weight: 400; letter-spacing: -0.02em;
    color: var(--fg-muted); margin: 0 0 18px;
    /* overflow:visible so text is never clipped even at narrow viewports */
    display: inline-flex; align-items: baseline; min-height: 1.1em;
    overflow: visible;
    font-family: 'Geist', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  }
  .polyglot-hello .lang {
    display: inline-block;
    white-space: nowrap; /* prevents text from wrapping or being clipped mid-word */
    /* padding-right reserves room for the italic ink overhang; without it the
       slanted last glyph gets clipped on the right. (No will-change here — it
       promotes a composited layer that clips the overhang.) */
    padding-right: 0.12em;
    transition: opacity 280ms cubic-bezier(.2,.7,.2,1), transform 320ms cubic-bezier(.2,.7,.2,1);
  }
  .polyglot-hello .lang.swap-out { opacity: 0; transform: translateY(-6px); }
  .polyglot-hello .lang.swap-in  { opacity: 0; transform: translateY(8px);  }
  @media (prefers-reduced-motion: reduce) { .polyglot-hello .lang { transition: none; } }

  /* ── 12 · Drawn SVG underline ───────────────────────────────────── */
  .ulink {
    position: relative; text-decoration: none;
    color: inherit; padding-bottom: 4px;
    display: inline-flex; align-items: center;
  }
  .ulink > .ulink-svg {
    position: absolute; left: 0; right: 0; bottom: -1px;
    width: 100%; height: 8px; overflow: visible; pointer-events: none;
  }
  .ulink > .ulink-svg path {
    stroke: var(--blue); stroke-width: 1.6; fill: none;
    stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220;
    transition: stroke-dashoffset 480ms cubic-bezier(.2,.7,.2,1);
  }
  .ulink:hover > .ulink-svg path,
  .ulink:focus-visible > .ulink-svg path { stroke-dashoffset: 0; }
  .ulink:hover { color: var(--blue-fg); }

  /* ── 06 · Hero spotlight ────────────────────────────────────────── */
  /* The cursor glow lives on a FIXED, full-viewport layer (not a pseudo-
     element bound to the hero box). That way the radial gradient is only ever
     clipped by the screen edge — it never hits a container boundary and cuts
     off near the top of the page or the footer — and being fixed it adds no
     scroll height. Coordinates are viewport-relative (clientX/clientY). */
  .hero-spotlight { position: relative; }
  .hero-spotlight > .shell { position: relative; z-index: 1; }
  .spotlight-layer {
    position: fixed; inset: 0;
    z-index: 5;            /* over content, below the nav (50) */
    pointer-events: none; opacity: 0;
    transition: opacity 320ms ease;
    background: radial-gradient(520px circle at var(--mx,50%) var(--my,30%),
      color-mix(in oklab, var(--blue) 11%, transparent), transparent 65%);
  }
  .spotlight-layer.live { opacity: 1; }
  html[data-theme="dark"] .spotlight-layer {
    background: radial-gradient(560px circle at var(--mx,50%) var(--my,30%),
      color-mix(in oklab, var(--blue) 28%, transparent), transparent 65%);
    mix-blend-mode: screen;   /* adds luminosity over dark content */
  }
  @media (prefers-reduced-motion: reduce) { .spotlight-layer { display: none; } }

  /* ── 01 · Variable headline letters ─────────────────────────────── */
  .vh-l {
    display: inline-block;
    transition:
      font-weight 320ms cubic-bezier(.2,.7,.2,1),
      transform   320ms cubic-bezier(.2,.7,.2,1),
      color       320ms ease;
    will-change: font-weight, transform;
  }

  /* ── 08 · Featured card tilt + sheen ────────────────────────────── */
  .featured { transform-style: preserve-3d; }
  .featured-sheen {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(260px circle at var(--sx,50%) var(--sy,50%),
      rgba(255,255,255,0.22), transparent 60%);
    opacity: 0; transition: opacity 240ms ease; z-index: 3;
    mix-blend-mode: soft-light;
  }
  html[data-theme="dark"] .featured-sheen {
    background: radial-gradient(280px circle at var(--sx,50%) var(--sy,50%),
      rgba(255,255,255,0.16), transparent 60%);
    mix-blend-mode: screen;
  }
  .featured.is-tilting:hover .featured-sheen { opacity: 1; }

  /* ── Landing · variable-headline word grouping ──────────────────── */
  /* Words stay intact (no mid-word wrap). On mobile the name stacks
     first-name over last-name to avoid awkward overflow. */
  .vh-name .vh-word { display: inline-block; white-space: nowrap; }
  .vh-name .vh-space { display: inline; }
  @media (max-width: 640px) {
    .vh-name {
      display: flex; flex-direction: column; align-items: center;
      line-height: 0.98;
    }
    .vh-name .vh-space { display: none; }
  }

  /* ── Landing · the night sky ────────────────────────────────────── */
  /* The site reads top to bottom as sky → ground: this layer opens the page and
     the fir forest in the footer closes it, with the three scroll acts as the
     descent between them. The stars thin out as the footer approaches, so the
     sky hands over to the trees rather than being cut off. Keep the two ends in
     step — if the forest changes weight or the accent moves, the sky follows.

     DARK ONLY, and nothing here animates on its own — see NightSky in
     src/pages.jsx for both, and for why the canvas is fixed rather than
     absolute. z-index 0 keeps it under the content (the acts are z-index 1)
     and under the comet. */
  .sky-layer {
    position: fixed; inset: 0;
    display: block; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
    /* Soft vignette so the field stays calm at the screen edges. */
    -webkit-mask-image: radial-gradient(ellipse 88% 82% at 50% 45%, #000 0%, rgba(0,0,0,0.62) 62%, transparent 100%);
            mask-image: radial-gradient(ellipse 88% 82% at 50% 45%, #000 0%, rgba(0,0,0,0.62) 62%, transparent 100%);
  }

  /* ── Landing · scroll narrative (3 acts) ────────────────────────── */
  /* Act 1 — hero fills the first screen and vertically centres its content. */
  .lp-hero {
    min-height: 88vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; position: relative;
  }
  /* Scroll cue — a gentle "Scroll ↓" that bobs, then fades on first scroll. */
  .scroll-cue {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    display: inline-flex; flex-direction: column; align-items: center; gap: 7px;
    color: var(--fg-faint); pointer-events: none;
    font-family: 'Geist Mono', monospace;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  }
  .scroll-cue svg { width: 16px; height: 16px; animation: cueBob 1.8s ease-in-out infinite; }
  @keyframes cueBob {
    0%,100% { transform: translateY(0);   opacity: 0.55; }
    50%     { transform: translateY(4px); opacity: 1;    }
  }
  @media (prefers-reduced-motion: reduce) { .scroll-cue svg { animation: none; } }

  /* Hero composition — FIRST ● LAST with the accent dot as centrepiece, and a
     right-aligned editorial caption (role / location · time). The dot itself is
     an invisible spacer: the scroll-thread comet paints the visible dot, so
     there's never a doubled dot when the name letters animate. */
  .hero-frame {
    width: 100%; max-width: 1040px;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .hero-tags { display: flex; justify-content: flex-end; padding: 0 6px 18px; }
  .hero-sub  { display: flex; justify-content: flex-end; padding: 18px 6px 0; }
  .hero-tag {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--fg-muted); white-space: nowrap;
  }
  .hero-name {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(16px, 2.6vw, 36px); flex-wrap: nowrap;
    font-size: clamp(50px, 10vw, 116px); line-height: 0.92;
    letter-spacing: -0.04em; font-weight: 600; margin: 0; text-align: center;
  }
  .hero-name .vh-word { display: inline-flex; white-space: nowrap; }
  /* The visible accent dot — rises with the spotlight like the letters, and
     cross-fades into the comet on scroll. Smooth transition keeps the lift
     springy rather than jittery. */
  .hero-dot {
    flex: 0 0 auto; border-radius: 50%;
    width: clamp(20px, 2.8vw, 34px); height: clamp(20px, 2.8vw, 34px);
    background: var(--blue); box-shadow: 0 0 22px -2px var(--blue);
    transition: transform 260ms cubic-bezier(.2,.7,.2,1);
    will-change: transform;
  }
  .hero-cta { display: flex; gap: 10px; margin-top: clamp(30px, 5.5vh, 52px); }

  /* The scroll thread — a modern accent comet: a glowing head trailing a long,
     soft gradient ribbon that fades out behind it, plus a faint continuity
     line. BEHIND the content (z-index 0) so it never obstructs text; it shows
     through the name gap, the margins and above the deck title. */
  .thread-svg {
    position: absolute; top: 0; left: 0; width: 100%;
    z-index: 0; pointer-events: none; overflow: visible;
  }
  .thread-trail { stroke: var(--blue); stroke-width: 1.2; opacity: 0.10; stroke-linecap: round; }
  .thread-tail  { stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .thread-glow  { stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: 0.5; filter: url(#cometGlow); }
  .thread-svg .cg0 { stop-color: var(--blue); stop-opacity: 0; }
  .thread-svg .cg1 { stop-color: var(--blue); stop-opacity: 0.45; }
  .thread-svg .cg2 { stop-color: var(--blue); stop-opacity: 1; }
  .thread-halo { fill: var(--blue); opacity: 0.30; filter: url(#cometGlow); }
  .thread-core { fill: var(--blue); }
  @media (prefers-reduced-motion: reduce) { .thread-trail { opacity: 0.12; } }

  /* Lift the acts above the thread so the comet weaves behind them. */
  .lp-hero, .lp-manifesto, .lp-deck-section { position: relative; z-index: 1; }

  /* Mobile hero — stack the name (dot between), right-align stays tidy. */
  @media (max-width: 640px) {
    /* Sit the block in the upper third rather than dead-centre (which read as
       too low and pushed the CTAs under the bottom bar). Keeps the full-screen
       height so the scroll cue still anchors to the bottom. */
    .lp-hero { justify-content: flex-start; padding-top: 13vh; }
    .hero-tags { justify-content: center; padding-bottom: 16px; }
    .hero-sub  { justify-content: center; padding-top: 16px; }
    .hero-name { flex-direction: column; gap: 8px; font-size: clamp(46px, 16vw, 80px); }
    /* Indent the manifesto so the scroll comet runs in the clear left lane
       beside it (not behind the words). */
    .lp-manifesto-text { padding-left: 60px; padding-right: 26px; }
  }

  /* Act 2 — de-greying manifesto. Tall section = scroll runway; the inner
     sticky stage holds the line centre-screen while the words fill in. */
  .lp-manifesto { position: relative; }
  .lp-manifesto-sticky {
    position: sticky; top: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .lp-manifesto-text {
    max-width: 780px; margin: 0 auto; padding: 0 32px; text-align: left;
    font-size: clamp(26px, 3.6vw, 44px); line-height: 1.3;
    letter-spacing: -0.02em; font-weight: 500; color: var(--fg);
  }
  /* Opacity-only fill (theme-agnostic). Tiny transition smooths fast scrubs. */
  .lp-word { display: inline; opacity: 0.15; transition: opacity 90ms linear; }

  /* Act 3 — fanning project deck. Same sticky-stage pattern as the manifesto. */
  .lp-deck-section { position: relative; }
  .lp-deck-sticky {
    position: sticky; top: 0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 30px;
  }
  .lp-deck-head { text-align: center; }
  /* The cards are absolutely centred in this stage; its height just reserves
     vertical room (overflow stays visible so the fan + hover lift never clip). */
  .lp-deck-stage {
    position: relative; width: 100%; max-width: 1160px; height: 340px;
  }
  .deck-card {
    position: absolute; top: 50%; left: 50%; width: 264px;
    will-change: transform;
  }
  .deck-card-inner {
    display: block; border-radius: 16px; overflow: hidden;
    text-decoration: none; color: inherit;
    border: 1px solid color-mix(in oklab, var(--border-strong) 60%, transparent);
    background: var(--bg-elev);
    box-shadow: 0 18px 42px -22px rgba(0,0,0,0.34), inset 0 1px 0 rgba(255,255,255,0.22);
    transition: transform 240ms cubic-bezier(.2,.7,.2,1), box-shadow 240ms ease, border-color 240ms ease;
  }
  html[data-theme="dark"] .deck-card-inner {
    box-shadow: 0 18px 42px -22px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  /* Hover lifts the inner card only, so it stacks cleanly on top of the JS
     transform driving the fan on the outer .deck-card. */
  @media (hover: hover) and (pointer: fine) {
    .deck-card-inner:hover {
      transform: translateY(-12px) scale(1.03);
      border-color: var(--blue);
      box-shadow: 0 28px 54px -24px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.28);
    }
  }
  .deck-card .pm-cover { aspect-ratio: 16/10; }

  /* Mobile deck — wallet stack: cards piled with a peek; flick the top one to
     send it to the back, tap to open. A deliberately different interaction from
     Work's vertical list, so it never reads as a duplicate. */
  .deck-wallet-stage {
    position: relative; width: 100%; height: 300px;
    touch-action: pan-y; user-select: none; -webkit-user-select: none;
  }
  .deck-wallet-card {
    position: absolute; top: 0; left: 50%; width: 84%; margin-left: -42%;
    display: flex; flex-direction: column; will-change: transform;
    border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit;
    border: 1px solid var(--border-strong); background: var(--bg-elev);
    box-shadow: 0 22px 44px -24px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.18);
    cursor: grab; -webkit-tap-highlight-color: transparent;
    touch-action: pan-y;
  }
  html[data-theme="dark"] .deck-wallet-card {
    box-shadow: 0 24px 50px -24px rgba(0,0,0,0.78), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .deck-wallet-card:active { cursor: grabbing; }
  .deck-wallet-card .pm-cover { aspect-ratio: 16/10; }
  .deck-wallet-card .pm-cover img, .deck-wallet-card .pm-cover svg { pointer-events: none; }
  .deck-wallet-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; gap: 14px;
  }
  .deck-wallet-dots { display: flex; gap: 6px; }
  .deck-wallet-dot {
    width: 6px; height: 6px; border-radius: 999px; background: var(--border-strong);
    transition: width 300ms cubic-bezier(.2,.7,.2,1), background 300ms ease;
  }
  .deck-wallet-dot.on { width: 18px; background: var(--blue); }
  .deck-wallet-next {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; border: 0; cursor: pointer; padding: 4px;
    font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--fg-faint);
  }
  .deck-wallet-next svg { width: 13px; height: 13px; }

  .pm-card {
    flex: 0 0 auto; width: 300px;
    display: flex; flex-direction: column;
    border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit;
    border: 1px solid color-mix(in oklab, var(--border-strong) 60%, transparent);
    background: color-mix(in oklab, var(--bg-elev) 36%, transparent);
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: 0 10px 30px -20px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.28);
    /* Only transform/box-shadow/border animate — all GPU-friendly. */
    transition: transform 220ms cubic-bezier(.2,.7,.2,1), border-color 220ms ease, box-shadow 220ms ease;
  }
  html[data-theme="dark"] .pm-card {
    box-shadow: 0 10px 30px -20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  /* Whole card + its border grow together (scale), gated to real pointers so
     a tap on touch never leaves it stuck enlarged. Neutral shadow only — no
     coloured glow (it read as a clipped blue smudge at the bottom). */
  @media (hover: hover) and (pointer: fine) {
    .pm-card:hover {
      transform: scale(1.05);
      border-color: var(--blue);
      box-shadow: 0 16px 40px -24px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.3);
    }
  }
  .pm-cover { aspect-ratio: 16/9; width: 100%; overflow: hidden; background: var(--bg-soft); }
  .pm-cover img, .pm-cover svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pm-meta { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
  .pm-cat {
    font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fg-muted); padding: 3px 7px; border-radius: 5px;
    background: var(--tag-bg); border: 1px solid var(--border); flex-shrink: 0;
  }
  .pm-title {
    font-size: 14px; font-weight: 500; letter-spacing: -0.01em; color: var(--fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Home deck only (.deck-card-inner) — collapsed by default, unfolds on
     hover so the fan stays clean at rest and only gets denser on request. */
  .pm-summary {
    margin: 0; padding: 0 14px;
    max-height: 0; opacity: 0; overflow: hidden;
    font-size: 12.5px; line-height: 1.5; color: var(--fg-muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    /* Also include the standard property for broader compatibility */
    line-clamp: 2;
    transition: max-height 260ms cubic-bezier(.2,.7,.2,1), opacity 200ms ease, padding-bottom 260ms ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .deck-card-inner:hover .pm-summary { max-height: 52px; opacity: 1; padding-bottom: 14px; }
  }
  @media (max-width: 640px) {
    .pm-card { width: 230px; }
  }

  /* ── Projects · date-sort toggle ────────────────────────────────── */
  .sort-btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 38px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-elev);
    font-size: 13px; color: var(--fg-muted); cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
  }
  .sort-btn:hover { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-fg); }
  .sort-arrow { width: 14px; height: 14px; transition: transform 320ms cubic-bezier(.34,1.15,.6,1); }
  .sort-arrow.asc { transform: rotate(180deg); }

  /* Grid-density segmented control (Projects header) */
  /* Grid-density pills reuse the sliding-pill control, with a leading icon. */
  .pill-lead {
    display: inline-flex; align-items: center; color: var(--fg-faint);
    padding-left: 6px; padding-right: 2px; position: relative; z-index: 1;
  }
  .pill-lead svg { width: 15px; height: 15px; }
  .pill-group-cols .pill { font-family: 'Geist Mono', monospace; padding: 0 12px; }
  /* The control only matters on wide screens — narrower widths cap the columns. */
  @media (max-width: 1024px) { .pill-group-cols { display: none; } }

  /* ── About · looping interests band ─────────────────────────────── */
  .interests { margin-top: 72px; padding-top: 40px; border-top: 1px solid var(--border); }
  .interests-title { font-size: 28px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 500; margin: 10px 0 0; }
  /* Vertical padding gives chips headroom for the hover scale. Edge fade via
     overlay gradients (.ib-fade), not mask-image, so no shadow gets clipped. */
  .ib-wrap {
    position: relative; width: 100%; margin-top: 6px; padding: 22px 0;
    overflow-x: clip; overflow-y: visible;
  }
  .ib-fade {
    position: absolute; top: 0; bottom: 0; width: 7%;
    z-index: 2; pointer-events: none;
  }
  .ib-fade-l { left: 0;  background: linear-gradient(to right, var(--bg), transparent); }
  .ib-fade-r { right: 0; background: linear-gradient(to left,  var(--bg), transparent); }
  .ib-track {
    display: flex; gap: 12px; width: max-content;
    animation: ibScroll 32s linear infinite;
  }
  .ib-wrap:hover .ib-track { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) { .ib-track { animation: none; flex-wrap: wrap; } }
  @keyframes ibScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ib-chip {
    flex: 0 0 auto;
    display: inline-flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 18px 0 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-elev);
    transition: border-color 200ms ease, transform 200ms cubic-bezier(.2,.7,.2,1);
  }
  /* Whole chip + border scale together. Border-only emphasis — no drop shadow
     (the coloured shadow looked clipped/odd under the pills). */
  @media (hover: hover) and (pointer: fine) {
    .ib-chip:hover {
      border-color: var(--blue); transform: scale(1.08);
    }
  }
  .ib-ico {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--blue-soft); color: var(--blue-fg);
  }
  .ib-ico svg { width: 16px; height: 16px; }
  .ib-label { font-size: 14px; font-weight: 500; letter-spacing: -0.01em; color: var(--fg); white-space: nowrap; }

  /* ── Command palette ────────────────────────────────────────────── */
  .cmdk-back {
    position: fixed; inset: 0; z-index: 100;
    background: color-mix(in oklab, var(--bg) 50%, transparent);
    backdrop-filter: saturate(140%) blur(8px);
    -webkit-backdrop-filter: saturate(140%) blur(8px);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 12vh 16px 0;
    animation: cmdkBack 180ms ease-out;
  }
  @keyframes cmdkBack { from{opacity:0} to{opacity:1} }
  .cmdk-modal {
    width: 100%; max-width: 580px;
    border: 1px solid var(--border-strong); background: var(--bg-elev);
    border-radius: 14px;
    box-shadow: 0 32px 80px -28px rgba(0,0,0,0.35);
    overflow: hidden;
    animation: cmdkPop 220ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes cmdkPop {
    from { opacity:0; transform:translateY(-8px) scale(.98); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }
  .cmdk-mod-input {
    width:100%; border:0; outline:0;
    padding:16px 18px; background:transparent; color:var(--fg);
    font-size:15px; letter-spacing:-0.005em;
    border-bottom:1px solid var(--border);
  }
  .cmdk-mod-input::placeholder { color:var(--fg-faint); }
  .cmdk-mod-list  { padding:8px; max-height:320px; overflow-y:auto; }
  .cmdk-empty     { padding:28px 16px; text-align:center; color:var(--fg-faint); font-size:13px; font-family:'Geist Mono',monospace; }
  .cmdk-mod-item  {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:8px;
    font-size:14px; color:var(--fg); cursor:pointer;
    transition:background 100ms ease;
  }
  .cmdk-mod-item.sel          { background:var(--blue-soft); color:var(--blue-fg); }
  .cmdk-mod-icon  {
    width:22px; height:22px; border-radius:5px;
    background:var(--tag-bg); display:inline-flex; align-items:center; justify-content:center;
    font-family:'Geist Mono',monospace; font-size:11px; color:var(--fg-muted); flex-shrink:0;
  }
  .cmdk-mod-item.sel .cmdk-mod-icon { background:color-mix(in oklab,var(--blue) 20%,transparent); color:var(--blue-fg); }
  .cmdk-mod-label { flex:1; }
  .cmdk-mod-group {
    font-family:'Geist Mono',monospace; font-size:10px; color:var(--fg-faint);
    text-transform:uppercase; letter-spacing:.06em;
  }
  .cmdk-mod-item.sel .cmdk-mod-group { color:var(--blue-fg); opacity:0.75; }
  .cmdk-mod-kbd   {
    font-family:'Geist Mono',monospace; font-size:10px; color:var(--fg-muted);
    background:var(--bg-soft); border:1px solid var(--border);
    padding:2px 6px; border-radius:4px;
  }
  .cmdk-mod-foot  {
    display:flex; gap:14px; padding:8px 14px;
    border-top:1px solid var(--border);
    font-family:'Geist Mono',monospace; font-size:10px; color:var(--fg-faint);
    background:var(--bg-soft);
  }
  .cmdk-mod-foot kbd {
    display:inline-block; background:var(--bg-elev); border:1px solid var(--border);
    padding:1px 5px; border-radius:3px; font-size:10px; color:var(--fg-muted); margin-right:3px;
  }

  /* Command palette trigger in nav */
  .cmdk-trigger {
    display:inline-flex; align-items:center; gap:8px;
    height:36px; padding:0 10px 0 14px; border-radius:999px;
    border:1px solid var(--border); background:var(--bg-elev);
    font-size:12px; color:var(--fg-muted); cursor:pointer;
    transition:background 160ms ease,border-color 160ms ease,color 160ms ease;
  }
  .cmdk-trigger:hover { background:var(--blue-soft); border-color:var(--blue); color:var(--blue-fg); }
  .cmdk-trigger kbd {
    font-family:'Geist Mono',monospace; font-size:10px;
    background:var(--bg-soft); border:1px solid var(--border);
    padding:1px 5px; border-radius:4px; color:var(--fg-muted);
  }
  .cmdk-trigger:hover kbd { background:var(--bg-elev); border-color:var(--blue); color:var(--blue-fg); }
  @media (max-width:640px) { .cmdk-trigger span.label { display:none; } }

  /* ═══ Projects · grid cards ═══════════════════════════════════════ */
  .proj-grid { display:grid; grid-template-columns:repeat(var(--cols,2), minmax(0,1fr)); gap:20px; }
  /* Responsive caps override the chosen density so cards never get too cramped. */
  @media (max-width:1024px) { .proj-grid { grid-template-columns:repeat(2, minmax(0,1fr)) !important; } }
  @media (max-width:620px)  { .proj-grid { grid-template-columns:1fr !important; } }

  .proj-card {
    position:relative;
    display:flex; flex-direction:column;
    border:1px solid var(--border); border-radius:16px;
    background:var(--bg-elev); overflow:hidden; cursor:pointer;
    box-shadow:var(--shadow);
    will-change:transform; backface-visibility:hidden;
    /* Forces Safari/Chrome onto the masking paint path instead of the
       overflow-clip path — without it, the rounded corners can briefly
       show square edges the instant a 3D `rotateX/rotateY` is applied. */
    -webkit-mask-image:-webkit-radial-gradient(white, white);
    mask-image:radial-gradient(white, white);
    transition:border-color 240ms ease, box-shadow 240ms ease, transform 240ms cubic-bezier(.2,.7,.2,1);
  }
  .proj-card:hover {
    border-color:var(--blue);
    box-shadow:0 24px 60px -28px color-mix(in oklab,var(--blue) 38%,transparent);
    transform:translateY(-3px);
  }
  .proj-card:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  /* glassy cursor-tracked sheen, same technique as the featured card */
  .proj-card-sheen {
    position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(220px circle at var(--sx,50%) var(--sy,50%),
      rgba(255,255,255,0.20), transparent 60%);
    opacity:0; transition:opacity 240ms ease; z-index:3;
    mix-blend-mode:soft-light;
  }
  html[data-theme="dark"] .proj-card-sheen {
    background:radial-gradient(240px circle at var(--sx,50%) var(--sy,50%),
      rgba(255,255,255,0.14), transparent 60%);
    mix-blend-mode:screen;
  }
  .proj-card.is-tilting:hover .proj-card-sheen { opacity:1; }
  .proj-cover { position:relative; aspect-ratio:16/9; background:var(--bg-soft); overflow:hidden; }
  .proj-cover img, .proj-cover svg { transition:transform 500ms cubic-bezier(.2,.7,.2,1); }
  .proj-card:hover .proj-cover img, .proj-card:hover .proj-cover svg { transform:scale(1.04); }
  .proj-body { padding:18px 20px 16px; display:flex; flex-direction:column; flex:1; }
  .proj-meta { font-size:12px; color:var(--fg-muted); }
  .proj-title {
    margin:6px 0 0; font-size:19px; font-weight:500;
    letter-spacing:-0.015em; line-height:1.2; transition:color 200ms ease;
  }
  .proj-card:hover .proj-title { color:var(--blue-fg); }
  .proj-sum {
    margin:8px 0 0; font-size:14px; line-height:1.55; color:var(--fg-muted);
    display:-webkit-box; line-clamp:2; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .proj-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .proj-foot {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:auto; padding-top:16px;
  }
  .proj-details {
    display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500;
    color:var(--fg-muted); transition:color 200ms ease, gap 240ms cubic-bezier(.2,.7,.2,1);
  }
  .proj-details svg { width:13px; height:13px; transition:transform 240ms cubic-bezier(.2,.7,.2,1); }
  .proj-card:hover .proj-details { color:var(--blue-fg); gap:9px; }
  .proj-card:hover .proj-details svg { transform:translateX(3px); }

  /* category pill — shared by grid card, featured card and popup cover */
  .cat-pill {
    position:absolute; top:12px; left:12px;
    font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    background:rgba(255,255,255,0.92); color:#0a0a0a;
    padding:4px 8px; border-radius:6px; backdrop-filter:blur(8px);
  }

  /* link button — GitHub / Notion */
  .proj-link {
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 12px; border-radius:9px;
    border:1px solid var(--border-strong); background:var(--bg-soft);
    color:var(--fg); text-decoration:none; white-space:nowrap;
    font-size:12.5px; font-weight:500; cursor:pointer;
    transition:border-color 200ms ease, background 200ms ease, color 200ms ease, transform 160ms ease;
  }
  .proj-link svg { width:15px; height:15px; flex-shrink:0; }
  .proj-link:hover { border-color:var(--blue); background:var(--blue-soft); color:var(--blue-fg); }
  .proj-link:active { transform:scale(0.96); }
  /* --border/--bg-soft sit too close together in dark mode for a card-level
     chip to read against the card's own --bg-elev — lift it with a touch of
     foreground mixed in so it stays legible without a hardcoded color. */
  html[data-theme="dark"] .proj-link {
    border-color: color-mix(in oklab, var(--fg) 26%, var(--border-strong));
    background: color-mix(in oklab, var(--fg) 7%, var(--bg-elev));
  }
  html[data-theme="dark"] .proj-link:hover { border-color:var(--blue); background:var(--blue-soft); }

  /* tech tag pills (project cards, popup, featured) — same low-contrast issue
     as .proj-link above, same fix. */
  .tag-pill { background:var(--tag-bg); border:1px solid var(--border); color:var(--fg); }
  html[data-theme="dark"] .tag-pill {
    background: color-mix(in oklab, var(--fg) 7%, var(--tag-bg));
    border-color: color-mix(in oklab, var(--fg) 22%, var(--border-strong));
  }

  /* ═══ Project page (#/work/:id) ═══════════════════════════════════ */
  /* A dedicated page per project, replacing the old detail popup. Every block
     below is optional in data.js — the page simply skips what isn't there. */
  .pp { --pp-nav: 76px; --pp-rail: 232px; }

  /* ── Scroll reveal (see useReveal in pages.jsx) ───────────────────── */
  .pp-reveal {
    opacity:0; transform:translateY(16px);
    transition:opacity 620ms cubic-bezier(.2,.7,.2,1), transform 700ms cubic-bezier(.2,.7,.2,1);
  }
  .pp-reveal.in { opacity:1; transform:none; }

  /* ── Hero ─────────────────────────────────────────────────────────── */
  /* Plain paper in both themes — no tinted wash. The project's colour comes
     from its cover, sitting right there in the split. Short on purpose: the
     first section has to clear the fold, which is what invites the scroll. */
  .pp-hero { position:relative; padding:22px 0 4px; }
  .pp-hero-grid {
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,0.82fr);
    gap:52px; align-items:center; margin-top:26px;
  }
  .pp-hero-text { min-width:0; }

  /* Deliberately a full pill, not a whisper: leaving a project must never be
     a hunt. Repeated at the bottom of the page by .pp-outro-all. */
  .pp-back {
    display:inline-flex; align-items:center; gap:9px;
    height:34px; padding:0 15px 0 12px; cursor:pointer;
    border:1px solid var(--border-strong); border-radius:999px;
    background:var(--bg-elev); color:var(--fg);
    font-size:13px; font-weight:500;
    box-shadow:var(--shadow);
    transition:border-color 200ms ease, background 200ms ease,
               color 200ms ease, transform 160ms ease;
  }
  .pp-back:hover { border-color:var(--blue); background:var(--blue-soft); color:var(--blue-fg); }
  .pp-back:active { transform:scale(0.97); }
  .pp-back-ico {
    width:15px; height:15px; flex-shrink:0; transform:rotate(180deg);
    transition:transform 260ms cubic-bezier(.2,.7,.2,1);
  }
  .pp-back:hover .pp-back-ico { transform:rotate(180deg) translateX(3px); }
  html[data-theme="dark"] .pp-back {
    border-color:color-mix(in oklab, var(--fg) 26%, var(--border-strong));
    background:color-mix(in oklab, var(--fg) 7%, var(--bg-elev));
  }
  html[data-theme="dark"] .pp-back:hover { border-color:var(--blue); background:var(--blue-soft); }

  .pp-hero-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:24px; }
  .pp-hero-actions .proj-link { padding:10px 16px; font-size:13.5px; border-radius:11px; }

  /* Scroll cue — confirms the invitation the peeking section already made. */
  .pp-cue {
    display:block; margin:30px auto 0;
    width:36px; height:36px; padding:0; cursor:pointer;
    border:1px solid var(--border); border-radius:999px;
    background:var(--bg-elev); color:var(--fg-muted);
    animation:ppCue 2.4s ease-in-out infinite;
    transition:border-color 200ms ease, color 200ms ease, background 200ms ease;
  }
  .pp-cue svg { width:16px; height:16px; }
  .pp-cue:hover { border-color:var(--blue); color:var(--blue-fg); background:var(--blue-soft); animation-play-state:paused; }
  @keyframes ppCue {
    0%, 100% { transform:translateY(0);   }
    50%      { transform:translateY(5px); }
  }

  .pp-title {
    margin:14px 0 0; max-width:900px;
    font-size:clamp(34px, 5.2vw, 62px); line-height:1.03;
    letter-spacing:-0.035em; font-weight:500;
  }
  .pp-subtitle {
    margin-top:12px; max-width:760px;
    font-size:clamp(16px, 2vw, 21px); line-height:1.35;
    letter-spacing:-0.012em; color:var(--fg-muted);
  }
  .pp-rule {
    width:64px; height:2px; margin:26px 0 20px;
    background:var(--blue); border-radius:2px;
  }
  .pp-lead {
    margin:0; max-width:62ch;
    font-size:clamp(15px, 1.5vw, 18px); line-height:1.62; color:var(--fg-muted);
  }
  .pp-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
  .pp-chip {
    display:inline-flex; align-items:center; height:28px; padding:0 12px;
    border-radius:999px; font-size:12.5px; color:var(--fg);
    border:1px solid color-mix(in oklab, var(--fg) 14%, transparent);
    background:color-mix(in oklab, var(--bg-elev) 68%, transparent);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }

  /* The cover: whole, never cropped, and capped so a tall or square one can't
     blow the hero past a screen. object-fit:contain makes the cap safe —
     without it, max-height with width:100% would stretch the image. */
  .pp-shot { margin:0; animation:ppShot 720ms 120ms cubic-bezier(.2,.7,.2,1) both; }
  @keyframes ppShot {
    from { opacity:0; transform:translateY(18px) scale(0.985); }
    to   { opacity:1; transform:none; }
  }
  .pp-shot-img, .pp-shot-art {
    display:block; width:100%; height:auto;
    max-height:340px; object-fit:contain;
    border-radius:14px; background:var(--bg-soft);
    border:1px solid color-mix(in oklab, var(--fg) 12%, transparent);
    box-shadow:0 24px 56px -28px rgba(0,0,0,0.34), 0 2px 8px -4px rgba(0,0,0,0.14);
  }
  /* Named SVG artwork has no intrinsic height — give it the covers' own ratio. */
  .pp-shot-art { position:relative; aspect-ratio:16/9; overflow:hidden; }

  /* ── Body: sticky spec rail + text column ─────────────────────────── */
  /* No align-items:start here — the rail column must STRETCH to the row's
     full height, otherwise it shrinks to its own content and the sticky
     inner box has no travel left to stick through. */
  .pp-main {
    display:grid; grid-template-columns:var(--pp-rail) minmax(0,1fr);
    gap:56px; margin-top:56px;
    scroll-margin-top:calc(var(--pp-nav) + 16px);   /* target of the scroll cue */
  }
  .pp-rail-inner {
    position:sticky; top:calc(var(--pp-nav) + 20px);
    display:flex; flex-direction:column; gap:26px;
  }
  .pp-facts { margin:0; display:flex; flex-direction:column; }
  .pp-fact { padding:11px 0; border-top:1px solid var(--border); }
  .pp-fact:first-child { border-top:0; padding-top:0; }
  .pp-fact dt {
    font-size:10.5px; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--fg-faint);
  }
  .pp-fact dd { margin:5px 0 0; font-size:13.5px; line-height:1.45; color:var(--fg); }
  .pp-rail-h {
    margin-bottom:12px; font-size:10.5px; letter-spacing:0.09em;
    text-transform:uppercase; color:var(--fg-faint);
  }
  /* Plain text, no badges — see the note above ProjectPage in pages.jsx. */
  .pp-tools { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .pp-tool { font-size:13.5px; line-height:1.4; color:var(--fg); }
  .pp-rail-links { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }

  /* ── Text column: one ink, size does the ranking ──────────────────── */
  /* Section titles carry the site accent; everything below them is the SAME
     ink (--fg), ranked by size and weight alone. The previous scale mixed
     six treatments and scattered the accent over numbers, ticks and rules —
     and ran the body in --fg-muted while the bullets ran in --fg, so the
     bullets outranked the prose they were illustrating. */
  .pp-content { min-width:0; padding-bottom:20px; }
  .pp-sec { margin-bottom:48px; }
  .pp-sec:last-child { margin-bottom:0; }
  .pp-sec-head { margin-bottom:16px; }
  .pp-sec-num {
    font-size:11px; letter-spacing:0.08em; color:var(--fg-faint);
    margin-bottom:12px;
  }
  .pp-sec-title {
    margin:0; font-size:clamp(22px, 2.3vw, 26px); line-height:1.22;
    letter-spacing:-0.022em; font-weight:500; color:var(--blue);
  }
  .pp-p { margin:0 0 15px; max-width:66ch; font-size:16px; line-height:1.72; color:var(--fg); }
  .pp-p:last-child { margin-bottom:0; }
  .pp-sub {
    margin:30px 0 12px; font-size:16px; font-weight:600;
    letter-spacing:-0.012em; color:var(--fg);
  }
  .pp-list { margin:4px 0 18px; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .pp-list li {
    display:flex; gap:12px; max-width:64ch;
    font-size:16px; line-height:1.65; color:var(--fg);
  }
  .pp-li-mark { flex-shrink:0; color:var(--fg-faint); user-select:none; }
  .pp-quote {
    margin:26px 0; padding:2px 0 2px 20px;
    border-left:2px solid color-mix(in oklab, var(--fg) 20%, transparent);
    font-size:17px; line-height:1.62; letter-spacing:-0.01em; color:var(--fg);
  }

  /* ── Numbers ──────────────────────────────────────────────────────── */
  /* A quiet mono run, not a display block. At 42px they were the loudest
     thing on the page for what is secondary information; the figure keeps
     full ink so it still registers, the label sits back in grey. */
  /* Spacing separates the groups, not a "·" character: a middot rendered as
     a flex child wraps to the next line glued to the wrong group. The
     full-ink figure opening each pair is delimiter enough. */
  .pp-metrics {
    display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 30px;
    margin:22px 0 34px; max-width:64ch;
    font-family:'Geist Mono',monospace; font-size:12.5px;
    line-height:1.7; letter-spacing:0.03em; color:var(--fg-muted);
    opacity:0; transform:translateY(8px);
    transition:opacity 460ms ease, transform 520ms cubic-bezier(.2,.7,.2,1);
  }
  .pp-metrics.in { opacity:1; transform:none; }
  .pp-metric { display:inline-flex; align-items:baseline; gap:6px; }
  .pp-metric-v { font-weight:500; color:var(--blue); }

  /* ── Gallery — scroll-snap film strip ─────────────────────────────── */
  .pp-gal-track {
    position:relative; display:flex; gap:18px;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; padding:10px 0 6px; outline:none;
  }
  .pp-gal-track::-webkit-scrollbar { display:none; }
  .pp-gal-track:focus-visible { outline:2px solid var(--blue); outline-offset:6px; border-radius:16px; }
  /* Flex spacers, not padding: both percentages then resolve against the same
     box, so the first and last frames can actually reach centre-snap. */
  .pp-gal-pad { flex:0 0 13%; }
  /* Only lightly dimmed: scale carries the focus. Pushed further down, a dark
     screenshot on light paper collapses into a flat grey slab and the peek
     stops reading as "another image". */
  .pp-slide {
    flex:0 0 74%; margin:0; scroll-snap-align:center;
    opacity:0.75; transform:scale(0.93);
    transition:opacity 420ms ease, transform 480ms cubic-bezier(.2,.7,.2,1);
  }
  .pp-slide.is-active { opacity:1; transform:none; }
  /* contain, not cover: a chart must keep its axes. The soft plate behind it
     absorbs whatever aspect ratio the screenshot happens to have. */
  /* 16/9 matches the shape a screenshot usually has, so `contain` leaves
     almost no letterboxing on the common case while still never cropping
     an odd one. */
  .pp-frame {
    display:block; width:100%; padding:0; aspect-ratio:16/9; cursor:pointer;
    border:1px solid var(--border-strong); border-radius:14px; overflow:hidden;
    background:var(--bg-soft); box-shadow:var(--shadow);
    transition:border-color 240ms ease, box-shadow 320ms ease;
  }
  .pp-frame img { display:block; width:100%; height:100%; object-fit:contain; }
  .pp-slide.is-active .pp-frame { box-shadow:var(--shadow-lg); }
  .pp-slide.is-active .pp-frame:hover { border-color:var(--blue); }

  .pp-gal-bar { display:flex; align-items:center; gap:14px; margin-top:16px; }
  .pp-gal-arrow {
    width:34px; height:34px; border-radius:10px; flex-shrink:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--border-strong); background:var(--bg-elev); color:var(--fg);
    transition:border-color 200ms ease, background 200ms ease, color 200ms ease,
               opacity 200ms ease, transform 160ms ease;
  }
  .pp-gal-arrow svg { width:16px; height:16px; }
  .pp-gal-arrow:hover:not(:disabled) { border-color:var(--blue); background:var(--blue-soft); color:var(--blue-fg); }
  .pp-gal-arrow:active:not(:disabled) { transform:scale(0.94); }
  .pp-gal-arrow:disabled { opacity:0.32; cursor:default; }
  .pp-cap-slot { flex:1; min-width:0; min-height:20px; text-align:center; }
  .pp-cap {
    display:inline-block; font-size:13px; line-height:1.45; color:var(--fg-muted);
    animation:ppCap 380ms cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes ppCap { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
  .pp-dots { display:flex; justify-content:center; gap:7px; margin-top:14px; }
  .pp-dot {
    width:7px; height:7px; padding:0; border:0; border-radius:999px; cursor:pointer;
    background:color-mix(in oklab, var(--fg) 22%, transparent);
    transition:width 320ms cubic-bezier(.2,.7,.2,1), background 240ms ease;
  }
  .pp-dot.on { width:22px; background:var(--blue); }
  /* A single image needs no carousel chrome. */
  .pp-single { margin:8px 0 0; }
  .pp-single .pp-cap { display:block; margin-top:14px; text-align:center; }

  /* ── Full-screen image viewer ─────────────────────────────────────── */
  .pp-lb {
    position:fixed; inset:0; z-index:200;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:40px 24px;
    background:color-mix(in oklab, var(--bg) 18%, rgba(0,0,0,0.86));
    backdrop-filter:blur(10px) saturate(130%); -webkit-backdrop-filter:blur(10px) saturate(130%);
    animation:ppLb 200ms ease-out;
  }
  @keyframes ppLb { from { opacity:0; } to { opacity:1; } }
  .pp-lb-fig {
    margin:0; max-width:min(1200px, 92vw); display:flex; flex-direction:column; gap:14px;
    animation:ppLbFig 300ms cubic-bezier(.2,.7,.2,1);
  }
  @keyframes ppLbFig { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:none; } }
  .pp-lb-fig img { display:block; max-width:100%; max-height:70vh; object-fit:contain; border-radius:12px; }
  .pp-lb-fig figcaption { text-align:center; font-size:13.5px; color:rgba(255,255,255,0.72); }
  .pp-lb-close {
    position:absolute; top:20px; right:20px;
    width:38px; height:38px; border-radius:10px; border:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.12); color:#fff;
    transition:background 180ms ease, transform 240ms cubic-bezier(.2,.7,.2,1);
  }
  .pp-lb-close:hover { background:rgba(255,255,255,0.22); transform:rotate(90deg); }
  .pp-lb-close svg { width:19px; height:19px; }
  .pp-lb-nav { display:flex; align-items:center; gap:16px; font-size:12px; color:rgba(255,255,255,0.8); }
  .pp-lb-nav button {
    width:36px; height:36px; border-radius:10px; border:0; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,0.12); color:#fff;
    transition:background 180ms ease, opacity 180ms ease;
  }
  .pp-lb-nav button svg { width:16px; height:16px; }
  .pp-lb-nav button:hover:not(:disabled) { background:rgba(255,255,255,0.22); }
  .pp-lb-nav button:disabled { opacity:0.3; cursor:default; }

  /* ── Takeaways ────────────────────────────────────────────────────── */
  .pp-skills {
    margin-top:72px; padding:52px 0;
    border-top:1px solid var(--border); background:var(--bg-soft);
  }
  /* Two columns, note stacked UNDER its name. Side by side across the full
     shell the note column ran 786px wide for ~490px of text, so 40% of every
     row was empty and the eye had to cross that gap from a short name to its
     note. Stacking halves the block's height and keeps lines short.
     CSS multi-column rather than grid: it balances any number of items and
     fills column one before column two, which is the reading order here. */
  .pp-skill-list {
    list-style:none; padding:0;
    margin:26px 0 -28px;          /* absorbs the last item's bottom margin */
    columns:2; column-gap:64px;
  }
  .pp-skill {
    display:block; margin:0 0 28px; max-width:40ch;
    break-inside:avoid; -webkit-column-break-inside:avoid;
    opacity:0; transform:translateY(10px);
    transition:opacity 460ms ease, transform 520ms cubic-bezier(.2,.7,.2,1);
    transition-delay:calc(var(--i,0) * 55ms);
  }
  .pp-skills-inner.in .pp-skill { opacity:1; transform:none; }
  .pp-skill-name {
    display:block; margin-bottom:6px;
    font-size:15.5px; font-weight:500; letter-spacing:-0.012em; color:var(--blue);
  }
  .pp-skill-note { display:block; font-size:14.5px; line-height:1.62; color:var(--fg-muted); }

  /* ── Outro — "all projects" beside "next project" ─────────────────── */
  .pp-outro { padding:36px 0 72px; }
  .pp-outro-inner { display:flex; align-items:stretch; gap:16px; }
  .pp-outro-all {
    display:flex; align-items:center; gap:14px; text-align:left;
    flex:0 0 auto; min-width:210px; padding:16px 22px; cursor:pointer;
    border:1px solid var(--border); border-radius:16px;
    background:var(--bg-soft); color:var(--fg);
    transition:border-color 240ms ease, background 200ms ease, transform 260ms cubic-bezier(.2,.7,.2,1);
  }
  .pp-outro-all:hover { border-color:var(--blue); background:var(--blue-soft); transform:translateY(-2px); }
  .pp-outro-all:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  .pp-outro-all .pp-back-ico { width:18px; height:18px; color:var(--fg-faint); }
  .pp-outro-all:hover .pp-back-ico { color:var(--blue); }
  .pp-outro-all-text { display:flex; flex-direction:column; gap:5px; }
  .pp-outro-all-title { font-size:17px; font-weight:500; letter-spacing:-0.015em; }
  .pp-outro-all:hover .pp-outro-all-title { color:var(--blue-fg); }

  .pp-next-card {
    flex:1 1 auto; min-width:0;
    display:flex; align-items:center; gap:20px; text-align:left;
    padding:16px 20px 16px 16px; cursor:pointer; color:var(--fg);
    border:1px solid var(--border); border-radius:16px;
    background:var(--bg-elev); box-shadow:var(--shadow);
    transition:border-color 240ms ease, box-shadow 300ms ease, transform 260ms cubic-bezier(.2,.7,.2,1);
  }
  .pp-next-card:hover {
    border-color:var(--blue); transform:translateY(-2px);
    box-shadow:0 24px 60px -28px color-mix(in oklab, var(--blue) 42%, transparent);
  }
  .pp-next-card:focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
  .pp-next-cover {
    position:relative; width:104px; flex-shrink:0; aspect-ratio:16/9;
    border-radius:10px; overflow:hidden; background:var(--bg-soft);
  }
  .pp-next-cover img, .pp-next-cover svg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .pp-next-text { display:flex; flex-direction:column; gap:5px; min-width:0; flex:1; }
  .pp-next-title { font-size:17px; font-weight:500; letter-spacing:-0.015em; color:var(--fg); }
  .pp-next-card:hover .pp-next-title { color:var(--blue-fg); }
  .pp-next-meta { font-size:11.5px; color:var(--fg-muted); }
  .pp-next-ico {
    width:18px; height:18px; flex-shrink:0; color:var(--fg-faint);
    transition:transform 300ms cubic-bezier(.2,.7,.2,1), color 240ms ease;
  }
  .pp-next-card:hover .pp-next-ico { transform:translateX(4px); color:var(--blue); }

  /* ── Responsive ───────────────────────────────────────────────────── */
  /* Under 900px the rail unsticks and, because it comes first in the DOM,
     lands as a compact fact strip between the hero and the text. */
  @media (max-width:900px) {
    .pp-hero-grid { grid-template-columns:1fr; gap:30px; }
    .pp-shot-img, .pp-shot-art { max-height:300px; }
    .pp-main { grid-template-columns:1fr; gap:32px; margin-top:36px; }
    .pp-rail-inner { position:static; gap:22px; }
    .pp-facts { display:grid; grid-template-columns:repeat(auto-fit, minmax(132px,1fr)); gap:0 22px; }
    .pp-fact, .pp-fact:first-child { border-top:1px solid var(--border); padding:10px 0; }
    .pp-tools { flex-direction:row; flex-wrap:wrap; gap:8px; }
    .pp-tool {
      padding:5px 12px; border-radius:999px;
      border:1px solid var(--border); background:var(--bg-elev);
    }
    .pp-rail-links { flex-direction:row; flex-wrap:wrap; }
    .pp-outro-inner { flex-direction:column; }
    .pp-outro-all { min-width:0; }
  }
  @media (max-width:640px) {
    .pp { --pp-nav:70px; }
    .pp-shot-img, .pp-shot-art { border-radius:12px; }
    /* The rail strip under the cover keeps the tools and nothing else. The
       facts it drops are all already in the hero — date and category in the
