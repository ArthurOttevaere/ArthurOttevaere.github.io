<!-- Runs before the first paint: theme, the .js flag the reveals depend on,
     the rewrite of old #/work/f1 links to the new /work/f1/ addresses, and the
     decision of whether this load gets the greeting splash. -->
<script>
(function(){
  var d = document.documentElement;
  d.classList.add('js');

  // A reload always starts at the top. The splash closes into the dot of the
  // name, which lives at the top of the page — restoring the old scroll
  // position would send the orange off the top of the screen instead.
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}

  // Legacy hash routes (#/work/f1) → real paths (/work/f1/).
  var h = location.hash || '';
  if (h.indexOf('#/') === 0) {
    var p = h.slice(2).replace(/\/+$/, '');
    var to = p ? '/' + p + '/' : '/';
    try { history.replaceState(null, '', to); } catch (e) { location.replace(to); }
  }

  // The splash is the front door: it plays when you arrive at the home page,
  // not when you open a project from a search result. Everywhere else the
  // markup below is hidden before it can paint, and removed right after.
  var path = location.pathname.replace(/index\.html$/, '');
  window.__splash = path === '/' || path === '';
  if (!window.__splash) d.classList.add('no-splash');

  try {
    var stored = sessionStorage.getItem('ao-theme');
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    d.setAttribute('data-theme', dark ? 'dark' : 'light');
    // On iOS this meta is what paints the strip behind the Dynamic Island, so
    // it starts on the colour of the splash when there is one; app.jsx keeps
    // it on whatever is at the top of the screen from there on.
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', window.__splash ? (dark ? '#FF6E40' : '#FF4A12')
                                                     : (dark ? '#0E0E11' : '#F6F4EF'));
  } catch (e) { d.setAttribute('data-theme', 'light'); }
})();
</script>

<!-- Boot splash: the greetings on orange. When the site is ready it closes
     into the dot of the name — see the hand-off in app.jsx. -->
<div id="boot">
  <span class="boot-hello"><span id="boot-word">Hello</span><span class="bd"></span></span>
  <div class="boot-meta"><span>Arthur Ottevaere</span><span>Portfolio · 2026</span></div>
</div>
<noscript>
  <div style="padding:120px 24px;text-align:center;font-family:Archivo,sans-serif">
    This portfolio needs JavaScript. The projects are also on
    <a href="https://github.com/ArthurOttevaere">github.com/ArthurOttevaere</a>.
  </div>
</noscript>
<script>
(function(){
  // Not the home page: no greetings, no splash to close — the page is simply
  // itself from the first frame.
  if (!window.__splash){
    var b0 = document.getElementById('boot');
    if (b0) b0.remove();
    return;
  }
  window.__bootStart = performance.now();
  // Three greetings, always — the site opens in the three languages it is
  // spoken in. __bootHold is how long that takes; app.jsx waits for it
  // before closing the splash into the dot of the name, so the sequence is
  // never cut short by a fast connection.
  var hellos = ["Hello","Bonjour","Hallo"];
  var STEP = 420;
  window.__bootHold = hellos.length * STEP;
  var el = document.getElementById('boot-word');
  if (!el) return;
  var i = 0;
  var id = setInterval(function(){
    if (i >= hellos.length - 1){ clearInterval(id); return; }   // hold the last one
    el.style.transition = 'opacity 130ms ease, transform 130ms ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(-6px)';
    setTimeout(function(){
      i += 1;
      el.textContent = hellos[i];
      el.style.transition = 'none';
      el.style.opacity = '0'; el.style.transform = 'translateY(7px)';
      requestAnimationFrame(function(){
        el.style.transition = 'opacity 130ms ease, transform 130ms ease';
        el.style.opacity = '1'; el.style.transform = 'none';
      });
    }, 130);
  }, STEP);
  window.__bootStop = function(){ clearInterval(id); };
  // Safety net: never trap anyone behind the splash if the app fails to mount.
  setTimeout(function(){
    var b = document.getElementById('boot');
    if (b && !b.classList.contains('closing')) {
      clearInterval(id);
      if (window.__topUnlock) window.__topUnlock();
      b.classList.add('fade');
      setTimeout(function(){ b.remove(); }, 500);
    }
  }, 12000);
})();
</script>
