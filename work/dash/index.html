<!-- Runs before the first paint: theme, the .js flag the reveals depend on,
     and the rewrite of old #/work/f1 links to the new /work/f1/ addresses. -->
<script>
(function(){
  var d = document.documentElement;
  d.classList.add('js');
  try {
    var stored = sessionStorage.getItem('ao-theme');
    var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    d.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', dark ? '#0E0E11' : '#F6F4EF');
  } catch (e) { d.setAttribute('data-theme', 'light'); }

  // Legacy hash routes (#/work/f1) → real paths (/work/f1/).
  var h = location.hash || '';
  if (h.indexOf('#/') === 0) {
    var p = h.slice(2).replace(/\/+$/, '');
    var to = p ? '/' + p + '/' : '/';
    try { history.replaceState(null, '', to); } catch (e) { location.replace(to); }
  }
})();
</script>

<!-- Boot splash: the greetings on orange. When the site is ready it closes
     into the dot of the name — see the hand-off in app.jsx. -->
<div id="boot">
  <span class="boot-hello"><span id="boot-word">Hello</span><span class="bd"></span></span>
  <div class="boot-meta"><span>Arthur Ottevaere</span><span>Portfolio · 2026</span></div>
</div>
<noscript>
  <div style="padding:120px 24px;text-align:center;font-family:Archivo,sans-serif">
    This portfolio needs JavaScript. The projects are also on
    <a href="https://github.com/ArthurOttevaere">github.com/ArthurOttevaere</a>.
  </div>
</noscript>
<script>
(function(){
  window.__bootStart = performance.now();
  var hellos = ["Hello","Bonjour","Hallo","Hola","Ciao","こんにちは","Olá","Hej"];
  var el = document.getElementById('boot-word');
  if (!el) return;
  var i = 0;
  var id = setInterval(function(){
    el.style.transition = 'opacity 130ms ease, transform 130ms ease';
    el.style.opacity = '0'; el.style.transform = 'translateY(-6px)';
    setTimeout(function(){
      i = (i + 1) % hellos.length;
      el.textContent = hellos[i];
      el.style.transition = 'none';
      el.style.opacity = '0'; el.style.transform = 'translateY(7px)';
      requestAnimationFrame(function(){
        el.style.transition = 'opacity 130ms ease, transform 130ms ease';
        el.style.opacity = '1'; el.style.transform = 'none';
      });
    }, 130);
  }, 520);
  window.__bootStop = function(){ clearInterval(id); };
  // Safety net: never trap anyone behind the splash if the app fails to mount.
  setTimeout(function(){
    var b = document.getElementById('boot');
    if (b && !b.classList.contains('closing')) { clearInterval(id); b.classList.add('fade'); setTimeout(function(){ b.remove(); }, 500); }
  }, 12000);
})();
</script>
