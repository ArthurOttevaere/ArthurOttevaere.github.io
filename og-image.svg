<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#fafaf9"/>
  <!-- subtle blue glow, echoing the site's cursor spotlight -->
  <defs>
    <radialGradient id="glow" cx="28%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="65%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- brand mark + name -->
  <g transform="translate(90, 96)">
    <rect width="34" height="34" rx="9" fill="#2563eb"/>
    <rect x="12" y="12" width="10" height="10" rx="2" fill="#fafaf9"/>
    <text x="50" y="25" font-size="22" font-weight="500" fill="#0a0a0a" letter-spacing="-0.3">Arthur Ottevaere</text>
  </g>

  <!-- headline -->
  <text x="88" y="330" font-size="92" font-weight="600" fill="#0a0a0a" letter-spacing="-3">Arthur Ottevaere<tspan fill="#a1a1aa">.</tspan></text>

  <!-- tagline -->
  <text x="92" y="392" font-size="30" fill="#52525b" letter-spacing="-0.4">Business Engineering · Business Analytics</text>

  <!-- footer line -->
  <text x="92" y="540" font-size="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#71717a">Dashboards · Data projects · Formula 1 · Tournai, BE</text>
  <rect x="92" y="560" width="64" height="3" rx="2" fill="#2563eb"/>
</svg>
