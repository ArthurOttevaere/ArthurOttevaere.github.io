<!--
  Open Graph card template (1200×630). This is rendered to a PNG by
  tools/generate-og.mjs — edit the copy / colours here, then re-run:
      node tools/generate-og.mjs
  Uses the real "a." brand mark and the site's own Geist fonts so the preview
  matches the site exactly.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }

  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(125% 125% at 10% 4%, #ffffff 0%, #f5f5f7 52%, #eceef4 100%);
    font-family: 'Geist', system-ui, sans-serif; color: #0a0a0a;
  }
  /* Soft accent spotlight (echoes the site's cursor glow) */
  .glow {
    position: absolute; top: -260px; left: -180px; width: 820px; height: 820px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,.22), rgba(37,99,235,0) 60%);
  }
  /* Oversized faint monogram bleeding off the right edge */
  .watermark {
    position: absolute; top: 50%; right: -140px; transform: translateY(-50%);
    height: 620px; color: #2563eb; opacity: .07;
  }
  .watermark svg { height: 100%; width: auto; display: block; }

  .content {
    position: relative; z-index: 1; height: 100%;
    padding: 92px 90px 84px; display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 15px; }
  .brand .mark { height: 42px; width: auto; color: #2563eb; display: block; }
  .brand .url {
    font-family: 'Geist Mono', monospace; font-size: 22px;
    letter-spacing: .01em; color: #52525b;
  }

  .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .headline {
    font-size: 106px; font-weight: 700; letter-spacing: -.035em; line-height: .98;
  }
  .headline .dot { color: #a1a1aa; }
  .tagline {
    margin-top: 28px; font-size: 34px; font-weight: 400;
    letter-spacing: -.012em; color: #52525b;
  }

  .foot { display: flex; flex-direction: column; gap: 16px; }
  .foot .rule { width: 68px; height: 4px; border-radius: 2px; background: #2563eb; }
  .foot .line {
    font-family: 'Geist Mono', monospace; font-size: 22px;
    letter-spacing: .01em; color: #71717a;
  }
</style>
</head>
